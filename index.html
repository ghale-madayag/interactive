<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaktibong Reviewer — Grade 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#4f46e5; --bg2:#7c3aed; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --accent:#f59e0b; --accent2:#ec4899; --good:#16a34a; --bad:#dc2626;
    --soft:#eef2ff; --soft2:#faf5ff; --ring:#c7d2fe;
    --a1:#ef4444; --a2:#8b5cf6; --a3:#0ea5e9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--h-ink);
    background:linear-gradient(180deg,#f1ecff 0%,#f8f6ff 340px,#f8f6ff 100%) fixed;
    min-height:100vh;
    overflow-x:clip;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:none;margin:0;padding:0}
  /* every screen is a centred column of cards under a full-bleed hero */
  #app{max-width:860px;margin:0 auto;padding:28px 24px 60px;display:flex;flex-direction:column;gap:18px}
  body.home-theme #app,body.read-theme #app{max-width:none;margin:0;padding:0;display:block}
  .pg-hero{width:100vw;margin:-28px calc(50% - 50vw) 8px;background:linear-gradient(120deg,#6d28d9,#7c3aed 55%,#8b5cf6);padding:18px 0 16px}
  .pg-hero-in{max-width:860px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:12px}
  @media(max-width:520px){
    #app{padding:22px 18px 48px}
    .pg-hero{margin-top:-22px}
    .pg-hero-in{padding:0 18px}
  }
  .btn{
    cursor:pointer;border:none;border-radius:16px;font-weight:700;font-size:16px;
    padding:14px 18px;transition:transform .06s ease, box-shadow .15s ease, background .15s;
    background:var(--accent);color:#3b2600;box-shadow:0 4px 0 #b8791f;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8791f}
  .btn.secondary{background:#fff;color:var(--ink);box-shadow:0 4px 0 #cbd5e1}
  .btn.secondary:active{box-shadow:0 1px 0 #cbd5e1}
  .btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;font-weight:600}
  .btn.small{font-size:14px;padding:9px 14px;border-radius:12px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.18);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}

  .lesson-card{cursor:pointer;border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden;border:none;text-align:left;transition:transform .08s}
  .lesson-card:active{transform:scale(.98)}
  .lesson-card .num{font-size:13px;opacity:.9;font-weight:700}
  .lesson-card h3{margin:6px 0 6px;font-size:18px;line-height:1.25}
  .lesson-card .meta{font-size:12.5px;opacity:.92}
  .lesson-card .emoji{position:absolute;right:12px;top:10px;font-size:40px;opacity:.35}
  .prog{height:8px;border-radius:99px;background:rgba(255,255,255,.35);margin-top:12px;overflow:hidden}
  .prog > i{display:block;height:100%;background:#fff;border-radius:99px;width:0}

  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:#4338ca;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700}

  h2.title{font-size:22px;margin:2px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}

  .menu-row{display:flex;gap:12px;flex-wrap:wrap}
  .act-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:16px;padding:14px;cursor:pointer;transition:.12s;margin-bottom:10px}
  .act-item:hover{border-color:var(--ring)}
  .act-item .ic{font-size:26px}
  .act-item .txt{flex:1}
  .act-item .txt b{display:block;font-size:15.5px}
  .act-item .txt span{font-size:12.5px;color:var(--muted)}
  .act-item .tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px}
  .tag.auto{background:#dcfce7;color:#166534}
  .tag.self{background:#fef9c3;color:#854d0e}
  .tag.read{background:#e0f2fe;color:#075985}
  .tick{color:var(--good);font-weight:800;font-size:18px}

  /* passages */
  .passage{background:var(--soft2);border-radius:16px;padding:18px;line-height:1.7;font-size:16px}
  .passage .ptext{white-space:pre-line}
  .passage.poem{white-space:pre-line;font-style:italic}
  .passage h4{margin:0 0 2px;font-size:19px;text-align:center;font-style:normal}
  .passage .by{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px;font-style:normal}
  .ingredients{background:#fff;border-radius:12px;padding:12px 16px;margin-top:12px}
  .ingredients li{margin:3px 0}

  /* quiz */
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .qcount{font-size:13px;color:var(--muted);font-weight:700}
  .qbar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .qbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .qtext{font-size:18px;font-weight:700;line-height:1.4;margin:2px 0 16px}
  .qtext .idx{color:var(--accent2)}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px;cursor:pointer;transition:.1s}
  .opt:hover{border-color:var(--ring);background:var(--soft)}
  .opt.correct{border-color:var(--good);background:#f0fdf4}
  .opt.wrong{border-color:var(--bad);background:#fef2f2}
  .opt .lead{font-weight:800;color:var(--muted);margin-right:8px}
  .opt.correct .lead{color:var(--good)}
  .opt.wrong .lead{color:var(--bad)}
  .fb{border-radius:12px;padding:12px 14px;font-size:14.5px;margin:4px 0 14px;font-weight:600}
  .fb.ok{background:#f0fdf4;color:#166534}
  .fb.no{background:#fef2f2;color:#991b1b}
  .navq{display:flex;justify-content:space-between;gap:10px;margin-top:6px}

  /* matching */
  .match-wrap{display:flex;gap:12px}
  .match-col{flex:1}
  .match-col h5{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .chip{display:block;width:100%;text-align:left;border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;font-size:14.5px;transition:.1s}
  .chip:hover{border-color:var(--ring)}
  .chip.sel{border-color:var(--accent2);background:#fdf2f8}
  .chip.done{border-color:var(--good);background:#f0fdf4;cursor:default;opacity:.85}
  .chip .badge{float:right;font-weight:800;color:var(--accent2)}
  .chip.done .badge{color:var(--good)}

  /* sequencing */
  .seq-item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .seq-item .pos{font-weight:800;background:var(--soft);color:#4338ca;border-radius:9px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .seq-item .body{flex:1;font-size:14px;line-height:1.35}
  .seq-item .arrows{display:flex;flex-direction:column;gap:3px}
  .seq-item .arrows button{border:none;background:var(--soft);border-radius:7px;width:30px;height:22px;cursor:pointer;font-size:12px;font-weight:800;color:#4338ca}
  .seq-item.ok{border-color:var(--good);background:#f0fdf4}
  .seq-item.bad{border-color:var(--bad);background:#fef2f2}

  /* fillblank */
  .fbq{font-size:16px;line-height:2.1;margin-bottom:14px}
  .fbq select{font-size:15px;padding:6px 8px;border-radius:10px;border:2px solid var(--ring);background:#fff;margin:0 4px}
  .fbq select.ok{border-color:var(--good);background:#f0fdf4}
  .fbq select.no{border-color:var(--bad);background:#fef2f2}
  .wordbox{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .wordbox span{background:var(--soft);color:#4338ca;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}

  /* truefalse */
  .tf-row{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .tf-row .st{font-size:15.5px;margin-bottom:9px;line-height:1.4}
  .tf-row .opts{display:flex;gap:8px}
  .tf-row .opts button{flex:1;border:2px solid #e5e7eb;background:#fff;border-radius:10px;padding:9px;font-weight:700;cursor:pointer;font-size:14px}
  .tf-row .opts button.pick{border-color:var(--accent2);background:#fdf2f8}
  .tf-row.ok{border-color:var(--good);background:#f0fdf4}
  .tf-row.bad{border-color:var(--bad);background:#fef2f2}

  /* shortcheck */
  .sc-q{font-size:16px;font-weight:700;margin:14px 0 8px;line-height:1.4}
  .sc-q .n{color:var(--accent2)}
  textarea{width:100%;border:2px solid #e5e7eb;border-radius:12px;padding:12px;font-size:15px;font-family:inherit;resize:vertical;min-height:70px}
  textarea:focus{outline:none;border-color:var(--ring)}
  .model{background:#ecfeff;border:1px dashed #06b6d4;border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14.5px;line-height:1.5}
  .model b{color:#0e7490}

  /* results */
  .result{text-align:center;padding:8px 4px}
  .result .big{font-size:64px}
  .result .score{font-size:44px;font-weight:900;margin:6px 0}
  .result .score small{font-size:20px;color:var(--muted)}
  .result .msg{font-size:16px;color:var(--muted);margin-bottom:18px}
  .stars{font-size:30px;letter-spacing:6px;margin:4px 0 8px}

  .note{background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:10px 14px;font-size:13px;color:#92400e;margin-top:12px}
  .center{text-align:center}
  .mt{margin-top:14px}
  a.origlink{display:inline-block;margin-top:12px;font-size:13px;color:#4338ca;font-weight:700}
  .hide{display:none}

  /* =========================================================
     HOME THEME — from the Claude Design project
     "Interactive app redesign for students" / Homepage.dc.html
     Scoped to body.home-theme so inner screens are untouched.
     ========================================================= */
  :root{
    --h-ink:#2a2440; --h-head:#3b2a6d; --h-body:#6b6288; --h-eyebrow:#8a7fb0;
    --h-line:#e9e2fb; --h-track:#f2edfc;
  }
  body.home-theme{
    background:linear-gradient(180deg,#f1ecff 0%,#f8f6ff 380px,#f8f6ff 100%) fixed;
    font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--h-ink);
  }
  body.home-theme .wrap{max-width:none;margin:0;padding:0}

  .hs-hero{background:linear-gradient(120deg,#6d28d9,#7c3aed 55%,#8b5cf6);padding:34px 24px 76px}
  .hs-hero-in{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .hs-brand{display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
  .hs-brand .mark{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .hs-brand .name{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:22px;color:#fff;line-height:1.1}
  .hs-brand .sub{font-size:13px;color:#ddd2ff;font-weight:600;margin-top:1px}
  .hs-hero h1{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:34px;margin:0;color:#fff;line-height:1.15;text-wrap:pretty}
  .hs-hero p{margin:8px 0 0;font-size:17px;line-height:1.6;color:#e6ddff;font-weight:600;max-width:560px}

  .hs-body{max-width:860px;margin:-48px auto 0;padding:0 24px 60px;display:flex;flex-direction:column;gap:18px}
  .hs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}

  .hs-card{
    background:#fff;border:1px solid var(--h-line);border-radius:24px;padding:22px 24px;
    box-shadow:0 4px 16px rgba(109,40,217,.08);
    display:flex;flex-direction:column;gap:14px;text-align:left;font:inherit;color:inherit;
    cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;
  }
  .hs-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(109,40,217,.14)}
  .hs-card:focus-visible{outline:3px solid #8b5cf6;outline-offset:3px}
  .hs-card.soon{opacity:.72;cursor:default}
  .hs-card.soon:hover{transform:none;box-shadow:0 4px 16px rgba(109,40,217,.08)}
  .hs-top{display:flex;align-items:center;gap:12px}
  .hs-ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
  .hs-eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--h-eyebrow)}
  .hs-name{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:21px;color:var(--h-head);line-height:1.15}
  .hs-meter{display:flex;flex-direction:column;gap:7px}
  .hs-stat{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
  .hs-stat .lessons{color:var(--h-body)}
  .hs-bar{height:10px;background:var(--h-track);border-radius:999px;overflow:hidden}
  .hs-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .hs-go{font-size:14px;font-weight:800}
  .hs-soon{font-size:14px;font-weight:700;color:var(--h-body)}

  .hs-note{background:#fff8ec;border:1px solid #fde4b8;border-radius:18px;padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
  .hs-note .ic{font-size:22px;line-height:1}
  .hs-note p{margin:0;font-size:15px;line-height:1.65;color:#7a5410;font-weight:600}

  @media(max-width:520px){
    .hs-hero{padding:26px 18px 68px}
    .hs-hero h1{font-size:28px}
    .hs-hero p{font-size:16px}
    .hs-body{padding:0 18px 48px}
    .hs-card{padding:20px}
  }

  /* =========================================================
     READING PAGE THEME — from the Claude Design project
     "Interactive app redesign for students" / Reading Page.dc.html
     ========================================================= */
  body.read-theme{
    background:linear-gradient(180deg,#f1ecff 0%,#f8f6ff 340px,#f8f6ff 100%) fixed;
    font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--h-ink);
  }
  body.read-theme .wrap{max-width:none;margin:0;padding:0}

  .rd-hero{background:linear-gradient(120deg,#6d28d9,#7c3aed 55%,#8b5cf6);padding:18px 24px 16px}
  .rd-hero-in{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .rd-brand{display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
  .rd-brand .mark{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .rd-brand .name{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:20px;color:#fff;line-height:1.1}
  .rd-brand .sub{font-size:13px;color:#ddd2ff;font-weight:600;margin-top:1px}
  .rd-crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
  .rd-crumbs .sep{color:#c4b0f5}
  .rd-chip{background:rgba(255,255,255,.14);color:#efe9ff;padding:5px 12px;border-radius:999px;border:none;font:inherit;cursor:pointer}
  .rd-chip:hover{background:rgba(255,255,255,.24)}
  .rd-chip.here{background:#fff;color:#6d28d9;cursor:default}

  .rd-prog{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--h-line);box-shadow:0 2px 10px rgba(109,40,217,.06);padding:12px 24px}
  .rd-prog-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .rd-prog .lbl{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:15px;color:#6d28d9;white-space:nowrap}
  .rd-prog .track{flex:1;height:12px;background:#ede8fb;border-radius:999px;overflow:hidden}
  .rd-prog .track i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#6d28d9);border-radius:999px;transition:width .4s ease}
  .rd-prog .pc{font-weight:800;font-size:14px;color:var(--h-eyebrow);white-space:nowrap}

  .rd-body{max-width:860px;margin:0 auto;padding:28px 24px 60px;display:flex;flex-direction:column;gap:18px}
  .rd-card{background:#fff;border:1px solid var(--h-line);border-radius:24px;padding:26px 30px;box-shadow:0 2px 12px rgba(109,40,217,.05)}
  .rd-card p{margin:0;font-size:18px;line-height:1.75}
  .rd-card p + p{margin-top:14px}
  .rd-card b{color:#6d28d9;font-weight:800}
  .rd-card strong{font-weight:800}

  .rd-title{text-align:center;padding:32px 36px}
  .rd-eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8b5cf6}
  .rd-title h1{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:34px;line-height:1.2;margin:10px 0 14px;color:var(--h-head);text-wrap:pretty}
  .rd-title .by{font-size:14px;font-weight:700;color:var(--h-body);margin:-6px 0 12px}
  .rd-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
  .rd-tags span{padding:5px 12px;border-radius:999px}

  .rd-callout{margin-top:16px;background:#fff8ec;border:1px solid #fde4b8;border-radius:16px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
  .rd-callout .ic{font-size:26px;line-height:1}
  .rd-callout p{font-size:17px;line-height:1.7;color:#7a5410}

  .rd-step{display:flex;flex-direction:column;gap:14px}
  .rd-stephead{display:flex;gap:16px;align-items:center}
  .rd-num{width:48px;height:48px;border-radius:16px;background:#ede9fe;color:#6d28d9;display:grid;place-items:center;font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:22px;flex-shrink:0}
  .rd-steplbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--h-eyebrow)}
  .rd-step h2{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:22px;margin:2px 0 0;color:var(--h-head)}
  .rd-quote{background:#f4f0ff;border-left:4px solid #8b5cf6;border-radius:12px;padding:14px 18px;font-size:18px;line-height:1.6;font-weight:700;color:#4c3591;font-style:italic}
  .rd-bullets{display:flex;flex-direction:column;gap:10px}
  .rd-bullet{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px}
  .rd-bullet .dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex-shrink:0}
  .rd-bullet p{font-size:17px;line-height:1.65}

  .rd-mark{font-family:inherit;font-weight:800;font-size:15px;color:#6d28d9;background:#fff;border:2px solid #d9ccf8;border-radius:999px;padding:9px 20px;cursor:pointer;align-self:flex-start;transition:background .15s ease}
  .rd-mark:hover{background:#f4f0ff}
  .rd-mark.done{color:#fff;background:#16a34a;border-color:#16a34a}
  .rd-mark.done:hover{background:#15803d}

  .rd-closing{background:linear-gradient(120deg,#f4f0ff,#eef6ff);border:1px solid #ded3f9;border-radius:24px;padding:26px 30px;display:flex;gap:14px;align-items:flex-start}
  .rd-closing .ic{font-size:28px;line-height:1}
  .rd-closing p{margin:0;font-size:18px;line-height:1.75;color:var(--h-head)}

  .rd-celebrate{background:#e8f7ee;border:2px solid #86d9a5;border-radius:24px;padding:22px 28px;text-align:center}
  .rd-celebrate .big{font-size:32px}
  .rd-celebrate .h{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:22px;color:#15803d}
  .rd-celebrate .s{font-size:15px;font-weight:600;color:#3f7a53;margin-top:4px}

  .rd-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .rd-btn{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:16px;border-radius:999px;padding:12px 24px;cursor:pointer;transition:background .15s ease,filter .15s ease}
  .rd-btn.back{color:#4c3591;background:#fff;border:2px solid #ded3f9}
  .rd-btn.back:hover{background:#f4f0ff}
  .rd-btn.locked{color:var(--h-eyebrow);background:#ece7f8;border:2px solid #ece7f8;cursor:not-allowed}
  .rd-btn.finish{color:#4a2c00;background:linear-gradient(180deg,#fbbf24,#f59e0b);border:2px solid #f59e0b;padding:12px 26px;box-shadow:0 3px 0 #d97706}
  .rd-btn.finish:hover{filter:brightness(1.05)}
  .rd-orig{font-size:14px;font-weight:700;margin-left:auto;color:#6d28d9}
  .rd-orig:hover{color:#5b21b6}

  .rd-card .passage{background:none;padding:0;border:none}
  .rd-card .ptext{font-size:18px;line-height:1.75;white-space:pre-wrap}
  .rd-card .poem .ptext{font-style:italic}
  .rd-card .ingredients{line-height:1.8}

  @media(max-width:520px){
    .rd-hero{padding:16px 18px 14px}
    .rd-body{padding:22px 18px 48px}
    .rd-card{padding:22px 20px}
    .rd-title{padding:26px 22px}
    .rd-title h1{font-size:27px}
    .rd-card p,.rd-quote,.rd-closing p{font-size:17px}
    .rd-prog{padding:10px 18px}
    .rd-prog .lbl{font-size:13px}
    .rd-orig{margin-left:0}
  }

  /* =========================================================
     SHARED COMPONENTS — restyled to the Claude Design language
     ========================================================= */
  .card{background:#fff;border:1px solid var(--h-line);border-radius:24px;padding:26px 30px;
    box-shadow:0 2px 12px rgba(109,40,217,.05);margin-bottom:0}
  .card.center{text-align:center}
  h2.title{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:26px;
    margin:2px 0 4px;color:var(--h-head);line-height:1.2}
  .sub{color:var(--h-body);font-size:15px;font-weight:600;margin:0 0 14px;line-height:1.6}
  .pill{display:inline-flex;align-items:center;gap:6px;background:#f1ecff;color:#6d28d9;
    border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}

  .btn{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:16px;
    border-radius:999px;padding:12px 26px;box-shadow:0 3px 0 #d97706;
    background:linear-gradient(180deg,#fbbf24,#f59e0b);border:2px solid #f59e0b;color:#4a2c00}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d97706}
  .btn.secondary{background:#fff;border:2px solid #ded3f9;color:#4c3591;box-shadow:none}
  .btn.secondary:hover{background:#f4f0ff;filter:none}
  .btn.secondary:active{transform:translateY(1px);box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.16);border:none;color:#fff;box-shadow:none}
  .btn.small{font-size:14px;padding:9px 18px}
  .btn[disabled]{opacity:1;cursor:not-allowed;background:#ece7f8;border-color:#ece7f8;
    color:var(--h-eyebrow);box-shadow:none;filter:none}

  /* subject screen — lesson cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
  .lesson-card{background:#fff;border:1px solid var(--h-line);border-radius:24px;padding:22px 24px;
    box-shadow:0 4px 16px rgba(109,40,217,.08);display:flex;flex-direction:column;gap:14px;
    text-align:left;font:inherit;color:inherit;cursor:pointer;overflow:visible;
    transition:transform .15s ease,box-shadow .15s ease}
  .lesson-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(109,40,217,.14)}
  .lesson-card:active{transform:translateY(-1px)}
  .lesson-card:focus-visible{outline:3px solid #8b5cf6;outline-offset:3px}
  .lesson-card .blurb{font-size:14px;line-height:1.6;color:var(--h-body);font-weight:600}
  .lesson-card .hs-meter{margin-top:auto}

  /* lesson screen — activity rows */
  .act-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--h-line);border-radius:18px;padding:16px 18px;cursor:pointer;
    margin-bottom:12px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .act-item:hover{transform:translateY(-2px);border-color:#d9ccf8;box-shadow:0 6px 18px rgba(109,40,217,.1)}
  .act-item:focus-visible{outline:3px solid #8b5cf6;outline-offset:2px}
  .act-item .ic{width:46px;height:46px;border-radius:14px;background:#f4f0ff;display:grid;
    place-items:center;font-size:24px;flex-shrink:0}
  .act-item .txt b{display:block;font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;
    font-weight:700;font-size:17px;color:var(--h-head);line-height:1.25}
  .act-item .txt span{font-size:13px;color:var(--h-body);font-weight:600}
  .act-item .tag{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;
    letter-spacing:.04em;white-space:nowrap}
  .tag.auto{background:#e8f7ee;color:#15803d}
  .tag.self{background:#fff4e0;color:#b45309}
  .tag.read{background:#f1ecff;color:#6d28d9}
  .tick{color:#16a34a;font-weight:800;font-size:20px}

  /* passages (non-reading-theme fallback) */
  .passage{background:#faf8ff;border:1px solid var(--h-line);border-radius:16px;padding:20px;
    line-height:1.75;font-size:17px}
  .passage h4{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;
    margin:0 0 2px;font-size:21px;text-align:center;color:var(--h-head)}
  .passage .by{text-align:center;color:var(--h-body);font-size:13px;margin-bottom:14px;font-weight:700}
  .ingredients{background:#fff;border:1px solid var(--h-line);border-radius:12px;padding:12px 16px;margin-top:12px}

  /* quiz */
  .qcount{font-size:13px;color:var(--h-eyebrow);font-weight:800}
  .qbar{height:12px;background:#ede8fb;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .qbar>i{background:linear-gradient(90deg,#8b5cf6,#6d28d9);transition:width .4s ease}
  .qtext{font-size:19px;font-weight:700;line-height:1.5;margin:2px 0 16px;color:var(--h-head)}
  .qtext .idx{color:#8b5cf6}
  .qtext b{color:#6d28d9}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e9e2fb;
    border-radius:16px;padding:15px 18px;margin-bottom:10px;font-size:16.5px;font-family:inherit;
    font-weight:600;color:var(--h-ink);cursor:pointer;transition:.12s}
  .opt:hover{border-color:#c4b0f5;background:#faf8ff}
  .opt.correct{border-color:#16a34a;background:#e8f7ee}
  .opt.wrong{border-color:#dc2626;background:#fef2f2}
  .opt .lead{font-weight:800;color:#8a7fb0;margin-right:8px}
  .opt.correct .lead{color:#15803d}
  .opt.wrong .lead{color:#b91c1c}
  .fb{border-radius:14px;padding:14px 16px;font-size:15px;margin:4px 0 14px;font-weight:600;line-height:1.6}
  .fb.ok{background:#e8f7ee;color:#15803d}
  .fb.no{background:#fef2f2;color:#991b1b}
  .navq{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}

  /* matching */
  .match-col h5{margin:0 0 8px;font-size:12px;color:var(--h-eyebrow);text-transform:uppercase;
    letter-spacing:.12em;font-weight:800}
  .chip{display:block;width:100%;text-align:left;border:2px solid #e9e2fb;background:#fff;
    border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:14.5px;
    font-family:inherit;font-weight:600;color:var(--h-ink);transition:.12s}
  .chip:hover{border-color:#c4b0f5;background:#faf8ff}
  .chip.sel{border-color:#8b5cf6;background:#f4f0ff}
  .chip.done{border-color:#16a34a;background:#e8f7ee;cursor:default;opacity:.9}
  .chip .badge{float:right;font-weight:800;color:#6d28d9}
  .chip.done .badge{color:#15803d}

  /* matching — from Matching Quiz.dc.html */
  .mtq-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
  .mtq-col{display:flex;flex-direction:column;gap:12px}
  .mtq-lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--h-eyebrow);padding-left:4px}
  .mtq-card{background:#fff;border:2px solid #e9e2fb;border-radius:18px;padding:16px 18px;
    box-shadow:0 2px 10px rgba(109,40,217,.05);cursor:pointer;display:flex;gap:12px;
    align-items:center;transition:all .15s ease;text-align:left;font:inherit;color:inherit;width:100%}
  .mtq-card:hover{border-color:#c4b0f5}
  .mtq-card p{margin:0;font-size:16px;line-height:1.6;font-weight:600;flex:1}
  .mtq-card.sel{border-color:#7c3aed;background:#f4f0ff;box-shadow:0 4px 14px rgba(109,40,217,.16)}
  .mtq-card.ok{border-color:#86d9a5;background:#f2fbf5;cursor:default}
  .mtq-card.no{border-color:#f5a7b6;background:#fdf1f3}
  .mtq-card.used{border-color:#cbb8f5;background:#faf8ff;opacity:.75}
  .mtq-card.target{border-style:dashed;border-color:#a78bfa;background:#faf8ff}
  .mtq-badge{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:15px;
    border-radius:999px;padding:4px 12px;flex-shrink:0;background:#6d28d9;color:#fff}
  .mtq-badge.ok{background:#16a34a}
  .mtq-badge.no{background:#dc2626}
  .mtq-letter{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:16px;
    flex-shrink:0;background:#ede9fe;color:#6d28d9}
  .mtq-letter.ok{background:#16a34a;color:#fff}
  .mtq-letter.no{background:#dc2626;color:#fff}
  .mtq-b p{font-weight:700;line-height:1.5}
  .mtq-perfect{background:#e8f7ee;border:2px solid #86d9a5;border-radius:24px;padding:24px 28px;text-align:center}
  .mtq-perfect .em{font-size:36px}
  .mtq-perfect .h{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:24px;color:#15803d}
  .mtq-perfect .s{font-size:15px;font-weight:600;color:#3f7a53;margin-top:4px}
  .mtq-partial{background:#fdeef0;border:2px solid #f5b8c4;border-radius:24px;padding:20px 26px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .mtq-partial .em{font-size:28px}
  .mtq-partial .txt{flex:1;min-width:220px}
  .mtq-partial .h{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:19px;color:#9f1239}
  .mtq-partial .s{font-size:14px;font-weight:600;color:#b5566c}
  .mtq-fix{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:15px;
    color:#fff;background:#dc2626;border:2px solid #dc2626;border-radius:999px;padding:10px 22px;cursor:pointer}
  .mtq-fix:hover{background:#b91c1c}
  @media(max-width:640px){
    .mtq-grid{grid-template-columns:1fr;gap:14px}
  }

  /* sequencing */
  .seq-item{background:#fff;border:2px solid #e9e2fb;border-radius:14px;padding:12px 14px;margin-bottom:9px}
  .seq-item .pos{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;
    background:#ede9fe;color:#6d28d9;border-radius:12px;min-width:34px;height:34px;font-size:16px}
  .seq-item .body{font-size:15px;line-height:1.5}
  .seq-item .arrows button{background:#f4f0ff;color:#6d28d9;border-radius:8px;width:32px;height:24px;font-weight:800}
  .seq-item .arrows button:hover{background:#ede9fe}
  .seq-item .grip{cursor:grab;touch-action:none;color:#b9a9e8;font-size:19px;line-height:1;
    padding:6px 2px;user-select:none;-webkit-user-select:none}
  .seq-item .grip:active{cursor:grabbing}
  .seq-item.dragging{opacity:.85;border-color:#8b5cf6;background:#f4f0ff;
    box-shadow:0 10px 24px rgba(109,40,217,.18);transform:scale(1.01)}
  .seq-list.dragging-any .seq-item:not(.dragging){transition:transform .12s ease}
  .seq-item.ok{border-color:#16a34a;background:#e8f7ee}
  .seq-item.bad{border-color:#dc2626;background:#fef2f2}

  /* fillblank */
  .fbq{font-size:17px;line-height:2.2;margin-bottom:14px;font-weight:600}
  .fbq select{font-size:15px;font-family:inherit;font-weight:700;padding:7px 10px;border-radius:12px;
    border:2px solid #d9ccf8;background:#fff;color:#4c3591;margin:0 4px}
  .fbq select.ok{border-color:#16a34a;background:#e8f7ee;color:#15803d}
  .fbq select.no{border-color:#dc2626;background:#fef2f2;color:#991b1b}
  .wordbox span{background:#f1ecff;color:#6d28d9;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:800}

  /* identification — type the answer */
  .idq{background:#fff;border:1px solid var(--h-line);border-radius:24px;padding:24px 28px;
    box-shadow:0 2px 12px rgba(109,40,217,.05);display:flex;flex-direction:column;gap:14px}
  .idq-head{display:flex;gap:14px;align-items:flex-start}
  .idq-num{width:40px;height:40px;border-radius:14px;background:#ede9fe;color:#6d28d9;display:grid;
    place-items:center;font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;
    font-size:18px;flex-shrink:0}
  .idq-head p{margin:4px 0 0;font-size:18px;line-height:1.65;font-weight:600}
  .idq input{font-family:inherit;font-size:17px;font-weight:700;color:var(--h-ink);background:#faf8ff;
    border:2px solid var(--h-line);border-radius:14px;padding:13px 16px;width:100%;box-sizing:border-box}
  .idq input::placeholder{font-weight:600;color:#b3abcc}
  .idq input:focus{outline:2px solid #a78bfa;outline-offset:0;border-color:#a78bfa}
  .idq input.ok{border-color:#16a34a;background:#f2fbf5;color:#15803d}
  .idq input.no{border-color:#dc2626;background:#fdf1f3;color:#9f1239}
  .idq input[disabled]{opacity:1}
  .id-fb{border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.6;font-weight:600}
  .id-fb.ok{background:#e8f7ee;border:1px solid #a9e3bf;color:#166534}
  .id-fb.no{background:#fdeef0;border:1px solid #f5b8c4;color:#9f1239}
  .id-fb .ans{font-weight:800}
  .idq.one{min-height:210px;scroll-margin-top:76px}
  .idq.one .idq-head p{font-size:19px}
  /* On a phone, lift the question above the lesson/title card so the answer box
     stays clear of the on-screen keyboard. Scoped to the paged answering view only. */
  @media(max-width:520px){
    body.idpage #app > .pg-hero{order:0}
    body.idpage #app > .rd-prog{order:1}
    body.idpage #app > .idq.one{order:2;min-height:0}
    body.idpage #app > .id-dots{order:3}
    body.idpage #app > .card{order:4}
    body.idpage #app > .id-nav{order:5}
    .idq.one .idq-head p{font-size:18px}
    /* three buttons will not fit on one narrow row: Previous/Next together, Back beneath */
    .id-nav{flex-wrap:wrap}
    .id-nav .btn{white-space:nowrap}
    .id-nav .right{order:1;margin-left:0;width:100%;justify-content:space-between}
    .id-nav > .btn.secondary{order:2;width:100%}
  }
  .id-nav{display:flex;gap:10px;align-items:center;margin-top:6px}
  .id-nav .right{margin-left:auto;display:flex;gap:10px}
  .id-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .id-dot{width:10px;height:10px;border-radius:50%;background:#e0d7f7;border:none;padding:0;cursor:pointer}
  .id-dot:hover{background:#c4b0f5}
  .id-dot.filled{background:#8b5cf6}
  .id-dot.at{outline:3px solid #ddd2ff;background:#6d28d9}
  .id-review-h{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:20px;
    color:var(--h-head);margin:2px 0 -4px}
  @media(max-width:520px){ .idq{padding:20px} .idq-head p{font-size:17px} }

  /* true or false — from True or False Quiz.dc.html */
  .rd-prog .sc{font-weight:800;font-size:14px;color:#15803d;white-space:nowrap}
  .tfq{background:#fff;border:1px solid var(--h-line);border-radius:24px;padding:24px 28px;
    box-shadow:0 2px 12px rgba(109,40,217,.05);display:flex;flex-direction:column;gap:16px}
  .tfq-head{display:flex;gap:14px;align-items:flex-start}
  .tfq-num{width:40px;height:40px;border-radius:14px;background:#ede9fe;color:#6d28d9;display:grid;
    place-items:center;font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;
    font-size:18px;flex-shrink:0}
  .tfq-head p{margin:4px 0 0;font-size:18px;line-height:1.65;font-weight:600}
  .tfq-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tfb{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:17px;
    border-radius:999px;padding:12px 20px;cursor:pointer;transition:all .15s ease;
    color:#4c3591;background:#fff;border:2px solid #ded3f9}
  .tfb:hover{background:#f4f0ff}
  .tfb.right{color:#fff;background:#16a34a;border-color:#16a34a}
  .tfb.wrong{color:#fff;background:#dc2626;border-color:#dc2626}
  .tfb.reveal{color:#15803d;background:#e8f7ee;border-color:#86d9a5}
  .tfb.dim{color:#b3abcc;background:#f5f2fd;border-color:#ece7f8;cursor:default}
  .tfb.right,.tfb.wrong,.tfb.reveal,.tfb.dim{cursor:default}
  .tfb.right:hover,.tfb.wrong:hover,.tfb.reveal:hover,.tfb.dim:hover{filter:none}
  .tf-fb{border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.6;font-weight:600}
  .tf-fb.ok{background:#e8f7ee;border:1px solid #a9e3bf;color:#166534}
  .tf-fb.no{background:#fdeef0;border:1px solid #f5b8c4;color:#9f1239}
  .tf-done{background:linear-gradient(120deg,#f4f0ff,#eef6ff);border:2px solid #cbb8f5;
    border-radius:24px;padding:28px 32px;text-align:center}
  .tf-done .em{font-size:40px}
  .tf-done .h{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:26px;
    color:var(--h-head);margin-top:4px}
  .tf-done .s{font-size:16px;font-weight:600;color:var(--h-body);margin-top:4px}
  .tf-done .acts{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  .tf-again{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:16px;
    color:#fff;background:#6d28d9;border:2px solid #6d28d9;border-radius:999px;padding:12px 26px;cursor:pointer}
  .tf-again:hover{background:#5b21b6}
  @media(max-width:520px){
    .tfq{padding:20px}
    .tfq-opts{grid-template-columns:1fr}
    .tfq-head p{font-size:17px}
  }

  /* truefalse */
  .tf-row{background:#fff;border:2px solid #e9e2fb;border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .tf-row .st{font-size:16px;margin-bottom:10px;line-height:1.5;font-weight:600}
  .tf-row .opts button{flex:1;border:2px solid #e9e2fb;background:#fff;border-radius:999px;padding:10px;
    font-family:inherit;font-weight:800;cursor:pointer;font-size:14px;color:var(--h-body);transition:.12s}
  .tf-row .opts button:hover{border-color:#c4b0f5;background:#faf8ff}
  .tf-row .opts button.pick{border-color:#8b5cf6;background:#f4f0ff;color:#6d28d9}
  .tf-row.ok{border-color:#16a34a;background:#e8f7ee}
  .tf-row.bad{border-color:#dc2626;background:#fef2f2}

  /* self-check — from Self-Check Essay.dc.html */
  .rd-prog .save{font-weight:800;font-size:14px;color:var(--h-eyebrow);white-space:nowrap}
  .scq{background:#fff;border:1px solid var(--h-line);border-radius:24px;padding:24px 28px;
    box-shadow:0 2px 12px rgba(109,40,217,.05);display:flex;flex-direction:column;gap:14px}
  .scq-head{display:flex;gap:14px;align-items:flex-start}
  .scq-num{width:40px;height:40px;border-radius:14px;background:#ede9fe;color:#6d28d9;display:grid;
    place-items:center;font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-weight:800;

              body:
`Ang digital citizenship ay tumutukoy sa kakayahan ng isang indibidwal na gumamit ng computer at iba pang digital device sa ligtas at responsableng pamamaraan. Digital citizen ang tawag sa taong nakapagsasagawa ng responsableng paggamit ng makabagong teknolohiya.

Ang Netiquette ay salitang nabuo sa pagsasama ng mga salitang internet at etiquette. Ito ay tumutukoy sa mga alituntunin, gabay o pamantayan ng katanggap-tanggap na pag-uugali habang gumagamit ng internet.

Mga Panuntunan ng Netiquette:
1. Makisalamuha nang tama at kumilos nang angkop sa lipunan.
2. Manatiling laging ligtas — tiyaking ligtas ang website (may https).
3. Panatilihin ang integridad at respeto sa kapwa.
4. Isaisip ang pakikisalamuhang nakatutulong.
5. Pahalagahan ang oras.
6. Umaayon sa tunay na buhay at panatilihin ang tunay na dahilan ng pakikipag-ugnayan.
7. Gamitin ang mga emoticon sa tamang pamamaraan.
8. Isaisip ang tamang baybay, sukat, kulay at bantas ng mga salita.
9. Manatili sa makabuluhang paksa lamang at gamitin nang wasto ang pagkakataon.
10. Alamin ang magiging epekto ng pakikipag-ugnayan.
11. Isaisip ang iyong digital footprint (bakas na naiiwan sa tuwing gumagamit ng internet).

Mahalaga ang netiquette upang mapanatili ang maayos at magalang na komunikasyon sa digital space at maiwasan ang di-pagkakaunawaan. Ang cybercrime naman ay ang pagsasagawa ng mga bagay na ipinagbabawal o ilegal gamit ang computer at internet.`

              body:
`Time is measured using two systems: the 12-hour clock and the 24-hour clock. Learning to use and convert between them helps you follow schedules, catch a jeepney, watch TV programs, and read airport or bus-station timetables.

The 12-hour clock (analog clock) divides the day into two periods: a.m. (ante meridiem, "before midday") and p.m. (post meridiem, "after midday"). It uses a dial numbered 1 to 12 with an hour hand and a minute hand. This system is common in everyday life in the Philippines.

The 24-hour clock (military or international time) shows time as a continuous cycle from 00:00 (midnight) to 23:59, without a.m. or p.m. It is written as HH:MM, where HH ranges from 00 to 23. For example, 14:30 is 2:30 p.m.

Key hours to remember: midnight is 00:00, noon is 12:00, and 1:00 p.m. is 13:00.

To convert 12-hour to 24-hour: keep the hour for morning (a.m.) times and remove "a.m."; for afternoon or evening (p.m.) times, add 12 to the hour. To convert 24-hour to 12-hour: for any hour greater than 12, subtract 12 and add "p.m."; morning hours stay the same with "a.m." Noon stays 12:00 in both formats.`

`Different parts of the world experience different times of the day because the Earth is divided into 24 time zones, each covering about 15 degrees of its 360-degree rotation. Time zones are measured in hours ahead of or behind Coordinated Universal Time (UTC), the starting point for all time calculations.

The Philippines operates in the UTC+8 time zone, meaning it is 8 hours ahead of UTC. This one time zone is used across the whole country, from Luzon to Mindanao.

To compare another city with Philippine time, find its UTC offset on a world time zone map. If the city is ahead of Manila, add the difference; if it is behind, subtract it. Examples: Tokyo (UTC+9) is 1 hour ahead of Manila; Sydney (UTC+11) is 3 hours ahead; New York (UTC-5) is 13 hours behind; Paris (UTC+1) is 7 hours behind.

So if it is 3:00 p.m. in Manila, it is 4:00 p.m. in Tokyo and 2:00 a.m. in New York (the next day).

Understanding time zones helps with travel, calling family who live abroad, and scheduling online classes or international events.`

              body:
`When a math problem has more than one operation, we must follow a set order so everyone gets the same, correct answer. That order is called GMDAS: Grouping symbols, Multiplication, Division, Addition, and Subtraction.

1. Grouping symbols (G) - parentheses ( ), brackets [ ], and braces { }. Always solve inside grouping symbols first, starting from the innermost group.

2. Multiplication (M) and Division (D) come next. They have the same priority, so perform them from left to right.

3. Addition (A) and Subtraction (S) come last. They also share priority, so perform them from left to right.

For example, in 8 + 6 × 2, do the multiplication first (6 × 2 = 12), then the addition (8 + 12 = 20).

Another example: (4 - 3) × 49 ÷ 7. Solve the parentheses first (4 - 3 = 1), then multiply (1 × 49 = 49), then divide (49 ÷ 7 = 7).

GMDAS is useful in real life - budgeting money, adjusting a recipe, or planning a schedule - anywhere precise calculation matters. Solving operations in the wrong order leads to incorrect results.`

`Multiplying fractions helps you solve everyday problems about measuring, recipes, and sharing. In mathematics, the word "of" usually means multiplication - for example, 1/2 of 3/4 means 1/2 × 3/4.

You can picture fraction multiplication with an area model. Draw a rectangle and shade one fraction with horizontal stripes and the other with vertical stripes. The overlapping (double-shaded) part shows the product. For 1/2 × 1/4, the rectangle is split into 8 equal parts and 1 part is double-shaded, so 1/2 × 1/4 = 1/8.

The quick method: multiply the numerators to get the new numerator, and multiply the denominators to get the new denominator. Example: 3/5 × 2/3 = (3 × 2)/(5 × 3) = 6/15, which simplifies to 2/5.

You can also use cancellation: if a numerator and a denominator share a common factor, divide both by it before multiplying. Example: 4/5 × 5/8 becomes 1/1 × 1/2 = 1/2.

To multiply a whole number by a fraction, write the whole number over 1. Example: 2/3 × 4 = 2/3 × 4/1 = 8/3. For multi-step problems, follow GMDAS and simplify your final answer.`

`A triangle is a polygon with three sides and three angles. A polygon is a plane figure, or two-dimensional shape, that is bounded by line segments - for example a triangle, a rectangle, or a square.

THE BASE. The base of a triangle is any one of its three sides. You can choose any side to be the base, depending on which side you are interested in for calculating the area. The term "base" refers to both the side itself and its length (the measurement).

THE HEIGHT. A triangle's height, also called its altitude, is the perpendicular distance from the chosen base to the opposite vertex. This line is drawn at a right angle (90 degrees) to the base. The height is always perpendicular to the base, no matter how the triangle is turned.

TYPES OF TRIANGLES ACCORDING TO SIDES
Equilateral triangle - all three sides and all three angles are congruent. Hash marks on the sides show that the sides are congruent to each other, and hash marks on the angles show that the angles are congruent.
Isosceles triangle - has at least two sides of equal length and two equal angles.
Scalene triangle - all sides and all angles are different. Since there are no hash marks, there are no equal sides or congruent angles.
Note: Use the symbol for congruent when comparing two figures. Use the equal sign when comparing measures of lengths.

PROPERTIES OF A TRIANGLE
1. The sum of the measures of all interior angles is always 180. This can be written as m∠1 + m∠2 + m∠3 = 180, where the symbol ∠ represents an angle.
2. The sum of the lengths of any two sides must be greater than the length of the remaining side: side 1 + side 2 is greater than side 3; side 2 + side 3 is greater than side 1; and side 3 + side 1 is greater than side 2.

Triangles are everywhere in Filipino culture. Think about the beautiful buntings used in fiestas - they often have triangle shapes. You might also see triangles in the traditional bahay-kubo, where they help make the roof strong. Even in crafts and designs like the parol (Christmas lantern), triangles play a big role. Triangular frameworks in bridges give them strength, which is why understanding triangles helps engineers and architects build structures that are both strong and beautiful.`

`PARALLELOGRAM
A parallelogram is a four-sided figure in geometry where opposite sides are equal in length and parallel to each other. Rectangles, rhombuses, and squares are all special types of parallelograms, so all the properties below apply to them as well.

Properties of a parallelogram:
1. Opposite sides are congruent. Opposite sides are equal in length, so side 1 = side 2 and side 3 = side 4. Hash marks on the sides indicate that opposite sides are equal.
2. Opposite angles are congruent. The angles directly across from each other are always the same.
3. Opposite sides are parallel. They run in the same direction and will never intersect. Arrows on the sides indicate that they are parallel, and the symbol ∥ represents "parallel."
4. Any two consecutive angles are supplementary. Angles next to each other add up to 180 degrees. For example, if one angle measures 20 degrees, the angle next to it measures 160 degrees.
5. A diagonal of a parallelogram forms two congruent triangles. The diagonals - lines drawn from one corner to the opposite corner - cut each other in half. The diagonals bisect each other, which means the point where they intersect is the midpoint of each diagonal. To bisect means to divide a segment or angle into two equivalent parts.

TRAPEZOID
Unlike parallelograms, trapezoids have only one pair of parallel sides. A trapezoid is a quadrilateral, a four-sided polygon, with exactly one pair of parallel sides. These parallel sides are called the bases of the trapezoid, while the non-parallel sides are known as the legs. The distance between the two parallel sides is called the height of the trapezoid.

Properties of an isosceles trapezoid:
1. One pair of parallel sides. The defining feature of a trapezoid is that it has exactly one pair of sides that are parallel, so side 1 is parallel to side 2 while side 3 is not parallel to side 4. If you extend side 3 and side 4, they will intersect at some point.
2. Consecutive angles are supplementary. Angles next to each other add up to 180 degrees, given that the angles are between the parallel sides. Angles that are not between the parallel sides will not be supplementary.
3. Midsegment. A line segment connecting the midpoints of the legs - the sides that are not parallel to each other - is called the midsegment, and it is parallel to the bases. The length of the midsegment is the average of the lengths of the two bases. For example, if base 1 = 6 cm and base 2 = 10 cm, then the midsegment is (6 + 10) divided by 2, which is 8 cm.`

`Measuring means comparing an unknown quantity to a known, fixed, or standard quantity. A measurement is composed of two parts: the numerical value and the unit of measure. Here is an example: an individual is 178 centimeters tall. The number 178 is the numerical value, and centimeters is the unit of measurement.

Measuring provides an exact description of an object's properties. Unlike qualitative observations, which are descriptive, measurement is a quantitative observation because its details are expressed in numerical form.

Length. Length is the distance between two points. A ruler is used to measure the length of an object in units of centimeters (cm), millimeters (mm), or inches (in). A meterstick is another measuring tool that can measure objects longer than a ruler. It can also measure short distances. Measurements made using a meterstick are expressed in centimeters (cm) or meters (m).

Mass. Mass is the amount of matter an object has. It may be expressed in milligrams (mg), grams (g), or kilograms (kg). A gram is used for small quantities of objects, while a kilogram is used for larger quantities. A milligram is used for quantities that are smaller than a gram. For instance, a pinch of salt is typically 600 mg, while a restaurant that uses a lot of salt will buy 1 kg or more. One way to measure mass is by using a platform balance. To use it, make sure the pointer is placed at zero, place the object on one of the balance's platforms, then move the slider on the beams until the pointer at the center points at zero. Another tool for measuring mass is the weighing scale used in markets, such as a kitchen scale, a bathroom scale, a digital scale, and a mechanical scale.

Volume. Volume is the amount of space occupied by matter. It is usually expressed in milliliters (mL), liters (L), or cubic centimeters (cm3). A milliliter is for small quantities, while a liter is used for larger quantities. A cubic centimeter is the same as one milliliter. A graduated cylinder can be used to measure the exact volume of a liquid. The liquid sample in a graduated cylinder has a curved surface called a meniscus. You read the lower meniscus for transparent liquids and the upper meniscus for colored or opaque liquids. To read the volume correctly, your eye must be on the same level as the bottom of the meniscus. Other measuring tools are a beaker and a measuring cup. A beaker is used to measure approximate or rough volume, because the volume read from a beaker is not as exact as that of a graduated cylinder. A measuring cup is used in the kitchen to measure ingredients in cooking, and its unit is usually in milliliters (mL). A ruler, on the other hand, must be used to determine the volume of a regularly shaped solid: measure its length, width, and height, then multiply length times width times height.

Temperature. Temperature is a measure of how hot or cold an object is. You use a thermometer to check the temperature of your body or of an object. A clinical thermometer is used in clinics and hospitals, and a laboratory thermometer is used in a science laboratory. Temperature can be expressed in degrees Celsius (C) or in degrees Fahrenheit (F). Degrees Celsius is the widely used unit of measurement, while degrees Fahrenheit is used in the United States. The boiling point of water is 100 degrees Celsius, which is equivalent to 212 degrees Fahrenheit. The freezing point of water is 0 degrees Celsius, which is equal to 32 degrees Fahrenheit.

Why measuring matters. Measuring is a crucial skill in cooking and baking. If you are baking, you need the right amount of ingredients such as flour, sugar, eggs, and milk. Accurate measurement can prevent food waste, produce products with the same results, affect the product's taste and appearance, and make sure that the content per serving is correct. Medicines also need to be measured carefully. Solid medicines are measured in milligrams or grams, while liquid medicines are measured in milliliters. Taking medicines with accurate measurement helps prevent the risk of overdosage, ensures the patient's safety, minimizes medication errors, and results in effective treatment. Measurement is also essential to measure your body temperature, which determines if you are sick, detects an early warning sign of infection or disease, and shows if you are well enough to go to school or work.`

`Living things have characteristics that make them similar, but they also differ in some ways. They are classified depending on the complexity of their structures and their means of reproduction. Living things can be grouped as plants, animals, and microorganisms. Plants are further grouped as flowering and nonflowering plants.

Plants are classified according to their structures and their means of reproduction. They use different structures to reproduce. Plants can be flowering or nonflowering.

Flowering plants, also known as angiosperms, are a large group of plants that produce flowers as part of their reproduction process. These plants are essential because they have special structures that allow them to produce seeds, which grow into new plants. In an angiosperm the seeds are enclosed inside a fruit. This cycle of producing seeds and new plants helps ensure that flowering plants continue to thrive in different environments such as forests, grasslands, and deserts. However, lack of sunlight and water may limit the locations where flowering plants thrive.

You may already be familiar with some flowering plants. Gumamela or hibiscus plants are often grown in gardens for their beautiful flowers. Mariposa or moth orchids are easily recognized by their moth wings-like flowers that are brightly colored. Palawan cherry blossoms are popular for their pink blooms, which typically appear in March or April. Although these plants look different from each other, they all have flowers with similar parts that are essential for reproduction.

Flowering plants not only produce seeds for new plants, but also provide food and make the surroundings beautiful. In the Philippines, some flowers such as the sampaguita, rosal, and gumamela are edible; they are used in teas, salads, or desserts. Some common flowering plants are used as decorations, such as the sampaguita, orchids, anthurium, and heliconia. Waling-waling, kalachuchi, and ylang-ylang flowers are extracted for their fragrant oils, which are used in making perfumes.

Some trees also bear flowers and fruits. Guavas have white flowers that mature into fruits, and the flesh of the guava fruit can be pinkish, white, or yellow. The white fragrant flowers of mango trees bloom from November to April, and mango fruits can be oval, round, or kidney-shaped. Unripe mango fruits have green skin and flesh with a sour taste, while ripe ones have yellow skin and flesh with a sweet taste. Star apples have greenish-yellow to purplish-white flowers and round or oval fruits. Pomelo flowers are round and white, the fruit skin is oval-shaped and green or yellow, and the flesh is pink. Santol flowers are yellow or whitish and the flesh of the fruit is white, with skin that is yellow if unripe and brown if ripe.`

`Nonflowering plants do not produce flowers or fruits. Instead, they reproduce using other methods, such as cones or spores. There are two main types of nonflowering plants: cone-bearing plants and spore-bearing plants.

Gymnosperms is a group of nonflowering plants that produce seeds inside cones instead of flowers. The word gymnosperm means "naked seed," because their seeds are not enclosed in a fruit, unlike those of flowering plants. Instead, gymnosperm seeds are exposed and held within cones. This group includes some of the most familiar and important trees in the world, known as conifers, ginkgophyta, and cycadophyta.

Conifers include trees such as pines, cedars, and redwoods. These trees are often found in forests and are known for their needlelike leaves and evergreen nature, which means they stay green year-round. Conifers are important to the environment and to humans, providing wood, paper, and other building materials. Conifers produce two types of cones: male cones and female cones. The male cones release pollen, which is carried by the wind to the female cones. When pollen reaches a female cone, it fertilizes an egg cell inside, forming a seed. Conifers have seed wings, tiny winglike structures attached to seeds. The wings work as propellers or parachutes, allowing the seeds to float in the air and be dispersed to the ground. In the Philippines, Baguio City is called the City of Pines because pine trees are abundant there.

Cycads are gymnosperm plants characterized by stout, woody trunks and a crown of large, stiff, evergreen leaves. Cycads reproduce by cones. They do not have flowers and fruits. They are found in tropical and subtropical zones, including the Philippines; the sago palm is a cycad found in the Philippines. Cycads have about 300 species. Cycads are dioecious, meaning each plant produces either pollen or seed. Several species are grown as ornamentals.

Ginkgo biloba, also known as the maidenhair tree in the Philippines, is one of the oldest living tree species. They are known for their unique fan-shaped leaves. The female ginkgo tree produces naked seeds, meaning they are not enclosed within an ovary or fruit, and the seeds are covered by a soft, pulpy layer. Like cycads, ginkgos are dioecious, meaning each tree is either male or female. If the seed lands in a suitable environment, it can germinate and grow into a new tree. Because seeds can grow on leaf surfaces, gymnosperms can survive in deserts, tropical forests, and arctic regions.

Spore-bearing plants do not produce seeds; they instead produce spores to reproduce. The most common examples of spore-bearing plants are mosses and ferns.

Mosses are small, soft plants growing in moist, shady areas such as forests and riverbanks. They form a green, carpet-like covering that can be found on the ground, on tree trunks, or even on rocks. Unlike vascular plants, mosses lack true roots, stems, or leaves. Instead, they have structures called rhizoids, which are tiny, hairlike threads that help the moss anchor itself to surfaces and absorb water and nutrients. Mosses reproduce using spores. When the capsule matures, it opens up, releasing the spores into the air, and the wind can carry them to new locations. If a spore lands in a place with the right conditions, such as a shady, moist spot, it can germinate and grow into a new moss plant. Even though they are small and simple, mosses play an essential role in the environment: they absorb water, which helps retain moisture; they may also absorb carbon dioxide, filtering the air and improving air quality; and they prevent soil erosion by covering the surface and holding the soil together.

Ferns are another type of nonflowering plant that reproduce using spores. They can be found in forests, wetlands, and even deserts. Unlike mosses, ferns possess roots, stems, and leaves. Fern leaves are called fronds. Young fronds, known as fiddleheads, are curled up; as they grow, they uncurl and become large, divided fronds. On the underside of fronds you can find small brown spots called sporangia, which contain spores. The yellow-brown cluster of sporangia is called sori. When spores are ready, they are released into the air, and if they land in a suitable environment, they grow into a tiny plant that eventually produces a new fern. Ferns help eliminate contamination in the soil and are known as natural air purifiers. People use ferns as ornaments in landscaping, as food sources, and in herbal medicine.`

              body:
`Animals are classified according to their similar characteristics: their body structure, their body covering, how they breathe, how they control their body temperature, and how they reproduce. The first and biggest division separates animals into vertebrates and invertebrates.

Vertebrates are animals that have a backbone, or vertebral column, inside their body. The backbone is part of an internal skeleton that supports the body and protects the spinal cord. Vertebrates are grouped into mammals, birds, reptiles, amphibians, and fishes.

Invertebrates are animals that do not have a backbone. Most invertebrates are small, and many have a hard outer covering called an exoskeleton instead of an internal skeleton. Insects such as butterflies, ants, and beetles are invertebrates, and so are spiders, crabs, shrimps, snails, worms, jellyfish, and starfish. Insects are the largest group of invertebrates. An insect has three body parts, which are the head, thorax, and abdomen, six legs, and usually one or two pairs of wings.

Mammals are vertebrates with hair or fur covering their body. They are endothermic, or warm-blooded, which means their body keeps a steady temperature even when their surroundings become hot or cold. They breathe through lungs. Most mammals give birth to live young, and the mother feeds the young with milk from her mammary glands. Examples are the carabao, dog, cat, tarsier, and the Philippine tamaraw. Whales and dolphins are also mammals even though they live in water, because they breathe through lungs and feed their young with milk. A few unusual mammals, such as the platypus and the echidna, lay eggs but still feed their young with milk.

Birds are vertebrates covered with feathers. They are endothermic. They breathe through lungs, have a beak instead of teeth, have two wings and two legs, and lay eggs with hard shells. Most birds can fly, but some, such as the ostrich and the penguin, cannot. Examples in the Philippines are the maya, the Philippine eagle, the chicken, and the duck.

Reptiles are vertebrates covered with dry scales or bony plates. They are ectothermic, or cold-blooded, which means their body temperature changes with their surroundings, so they bask in the sun to warm up and move to the shade to cool down. They breathe through lungs. Most reptiles lay eggs with leathery shells, often in a nest that keeps them safe and warm. Examples are the crocodile, snake, turtle, lizard or butiki, and the monitor lizard or bayawan.

Amphibians are vertebrates with moist, smooth skin and no scales. They are ectothermic. Their name means "two lives," because most amphibians begin life in water and later live on land. The young, such as a tadpole, breathe through gills; as adults they breathe through lungs and also through their moist skin. They lay soft, jelly-like eggs in water. Examples are the frog, toad, and salamander.

Fishes are vertebrates that live in water. Their body is covered with scales, and they have fins for swimming and a streamlined shape. They are ectothermic. They breathe through gills, which take in oxygen dissolved in the water. Most fishes lay many eggs in the water. Examples are the bangus, tilapia, shark, and the tiny sinarapan of Camarines Sur. A shark is a fish, not a mammal, because it breathes through gills and has fins and scales.`

              body:
`Microorganisms are very small living things. Most of them cannot be seen by the naked eye, so a microscope is needed to observe them. Even though they are tiny, microorganisms are everywhere: in the air, in water, in the soil, on the surfaces you touch, and even inside your body. Fungi and bacteria are two important groups of microorganisms.

Fungi. Fungi are living things that cannot make their own food, because they have no chlorophyll and cannot carry out photosynthesis. Instead, they absorb nutrients from the material they grow on, which may be dead plants and animals, damp bread, or a living host. Because they feed on dead and decaying material, many fungi are decomposers: they break down dead matter and return nutrients to the soil. Fungi reproduce by spores. Some fungi, such as yeast, are made of only one cell, while others, such as mushrooms and molds, are made of many cells. Mushrooms grow in damp, shady places and have a cap and a stalk. Molds are the fuzzy green, black, or white growths that appear on old bread, overripe fruit, and damp walls.

Fungi can be helpful or harmful. Helpful fungi include yeast, which makes bread rise and is used in making bread and other food; edible mushrooms such as the oyster mushroom, which are food; molds used to make medicines, such as the mold Penicillium from which the antibiotic penicillin was made; and the many fungi that decompose dead matter and enrich the soil. Harmful fungi include those that spoil food, those that cause plant diseases, and those that cause human illnesses such as an-an, buni or ringworm, and alipunga or athlete's foot. Some wild mushrooms are also poisonous and must never be eaten.

Bacteria. Bacteria are the smallest and simplest microorganisms. Each bacterium is made of only one cell and has no true nucleus. They can be seen only with a microscope. Bacteria come in several shapes: rod-shaped bacilli, round or spherical cocci, and spiral-shaped spirilla. Bacteria reproduce by dividing themselves into two, which is why their number can grow very quickly under warm and moist conditions. Bacteria live almost everywhere, including places that are too hot, too cold, or too salty for other living things.

Bacteria can also be helpful or harmful. Helpful bacteria turn milk into yogurt, cheese, and kefir, and are used in making vinegar and in fermenting food such as burong isda. Bacteria in the soil decompose dead plants and animals and return nutrients to the soil, and some bacteria that live on the roots of plants fix nitrogen so plants can grow. Bacteria in your intestines help you digest food and make some vitamins. Harmful bacteria are called pathogens, and they cause diseases such as tuberculosis, cholera, typhoid fever, tetanus, and food poisoning. To keep harmful microorganisms from spreading, wash your hands with soap and water, cook food thoroughly, store food properly in the refrigerator, drink clean or boiled water, cover your mouth when you cough or sneeze, and keep your surroundings clean.`

              closingP:[4,4],
              body:
`All plants have roots, stems, and leaves, but some plants have parts that are changed, or modified, to do a special job. These are called specialized structures. They are adaptations that help the plant get food, water, and sunlight, protect itself, store food, or reproduce in the place where it lives.

Specialized roots. Roots normally anchor the plant and absorb water and minerals. Some roots do more. Storage roots such as those of the camote, carrot, and radish become thick and fleshy because they store food. Aerial roots grow above the ground and absorb water and moisture from the air; orchids growing on tree branches use them. Prop roots grow out of the stem and down into the soil to give extra support, as in corn and the mangrove or bakawan. Buttress roots are wide, flat roots that spread out at the base of very tall rainforest trees such as the narra to keep them from toppling over. Clinging roots grow out of a climbing stem and grip a wall or a tree trunk.

Specialized stems. The stem normally holds the plant up and carries water and food between the roots and the leaves. Some stems are modified. A tuber, such as a potato, is a swollen underground stem that stores food; its "eyes" are buds that can grow into new plants. A rhizome, such as ginger or luya and turmeric or luyang dilaw, is an underground stem that grows sideways and stores food. A bulb, such as an onion or garlic, is a short underground stem surrounded by thick, fleshy leaves that store food. A runner or stolon, such as in strawberry or in kangkong, creeps along the ground and grows new plants at its joints. A tendril is a thin, coiling stem or leaf part that wraps around a support so a vine such as ampalaya, patola, or ubas can climb toward the sunlight. Thorns are sharp, pointed stems, as in bougainvillea, that protect the plant from animals that would eat it. A cactus has a thick, fleshy stem that stores water and also makes food, since its leaves are reduced to spines.

Specialized leaves. Leaves normally make food through photosynthesis. Some are modified for other work. Spines, as in cactus, are leaves reduced to needles; they lose very little water and protect the plant. Storage leaves, as in the aloe vera and the onion bulb, are thick and fleshy because they hold water or food. Insect-trapping leaves, as in the pitcher plant and the Venus flytrap, form traps that catch and digest insects, giving the plant nutrients that are missing in poor soil. Floating leaves, as in the water lily and the lotus, are broad and flat with air spaces so they float, and their stomata are on the upper surface so the plant can still exchange gases. A thick, waxy covering called a cuticle, as on gabi and banana leaves, keeps water from escaping and makes rain roll off. Hairy leaves trap moisture and discourage insects. Bracts, as in the bougainvillea and the poinsettia, are brightly colored leaves that look like petals and attract pollinators to the small true flowers.

Each of these structures is an adaptation, which means a feature that helps a living thing survive in its particular environment. A desert plant survives because it stores water and loses very little of it; a rainforest tree survives because its buttress roots keep it standing; a vine reaches the sunlight because its tendrils let it climb without growing a thick trunk.`

`The life cycle of most seed-bearing plants begins with a seed. Every seed houses an immature plant called an embryo. The embryo consists of the young leaves, called the plumule, and the young root, called the radicle.

The hard outer part of the seed that protects the embryo is the seed coat, or testa. In the inner part is the cotyledon, which stores food. The cotyledon provides nourishment to the embryo.

Germination is the beginning of the embryo's growth. As soon as the seed coat breaks, germination starts and a seedling grows. A seed needs the right temperature, water, and oxygen to germinate. During germination, the radicle emerges first and grows downward, becoming the first true root of the plant. The plumule grows upward and develops to become the first true leaves. The cotyledon, which is the source of food, gets smaller as the seedling grows.

As the plant continues to grow, the roots anchor in the soil and the cotyledons drop. The roots hold the plant in place and help it absorb water and nutrients from the soil. The stem grows toward the sun and becomes the passageway for water and nutrients between the roots and the leaves. The plant starts to make its food through the leaves.

Flower buds start to grow and then develop into flowers, which are essential to plant reproduction. Pollinators transfer pollen within the same flower, or from one flower to another. Examples of pollinators are birds and also insects such as butterflies and bees. As they visit flowers to feed or drink nectar, they carry and move pollen with them. When pollen is transferred, plant fertilization and reproduction happen. Then the plant life cycle continues.

Some flowers develop into fruits, which contain the seeds that are also essential in plant reproduction. Wind, animals, and humans carry seeds from fruits and scatter them in different places. When a seed lands on good ground or soil, it germinates and grows into a new plant, starting the cycle all over again.`

`Bago pa dumating ang mga dayuhan, may sariling paniniwala at kaugalian na ang mga sinaunang Pilipino. Makikita ang mga ito sa kanilang mga ritwal, sa kanilang pamumuhay, at maging sa mga bagay na naiwan nila.

Ang babaylan ay ang espirituwal na pinunong nangunguna sa ilang sinaunang ritwal sa mga Bisaya. Karaniwang babae ang gumaganap nito, at ebidensiya ito na may mahalagang katayuan ang kababaihan sa ilang sinaunang pamayanang Pilipino. Maaari silang magmay-ari o magmana ng ari-arian, makipagkalakalan, at gumanap sa mahahalagang tungkulin.

Ang animismo ay ang tawag sa paniniwalang may espiritu ang ilang bagay at bahagi ng kalikasan. Kaiba ito sa politeismo, na paniniwala naman sa maraming diyos at diyosa. Sa madaling sabi: ang animismo ay kaugnay ng mga espiritu sa kalikasan, samantalang ang politeismo ay paniniwala sa maraming diyos at diyosa.

Ang Manunggul Jar at iba pang sinaunang kagamitang panlibing ay nagbibigay ng ebidensiya na may paniniwala ang ilang sinaunang Pilipino tungkol sa kabilang buhay. Sa pamamagitan ng mga bagay na inililibing kasama ng yumao, nauunawaan natin ang kanilang pananaw sa buhay pagkamatay.

Ang kanggan ang tawag sa pantaas na kasuotan ng sinaunang kalalakihang Pilipino. Ang kasuotan noon ay nagpapakita rin ng katayuan ng isang tao sa pamayanan.

function load(){ try{return JSON.parse(localStorage.getItem(STORE))||{};}catch(e){return {};} }

function keyFor(a){return a.id;}
function setBest(a,pct){
  const k=keyFor(a); const cur=progress[k]||{};
  progress[k]={done:true, best:Math.max(cur.best||0,pct)};
  save();
}
function markDone(a){ const k=keyFor(a); progress[k]=Object.assign({done:true},progress[k]||{}); save(); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((i+1)* (hashStep(i)) )%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
// deterministic-ish shuffle avoiding Math.random dependency issues; fine for classroom use
let _seed=7;
function hashStep(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }

function getDraft(id){ return drafts[id]||null; }

/* ---------- lesson progress ---------- */
function lessonPct(l){
  const acts=l.activities; let done=0;
  acts.forEach(a=>{ if((progress[keyFor(a)]||{}).done) done++; });
  return Math.round(done/acts.length*100);
}

function lesson(id){

  const items=l.activities.map(a=>{
    const done=(progress[keyFor(a)]||{}).done;

    const tagTxt = a.tag==='auto'?t('tagAuto'):a.tag==='self'?t('tagSelf'):t('tagRead');
    const bestTxt = (a.tag==='auto'&&best!=null)?` · ${t('best')}: ${best}%`:'';

      <div class="ic">${a.icon}</div>
      <div class="txt"><b>${esc(a.name)}</b><span>${esc(a.desc)}${bestTxt}${inprog?' · ⏳ '+t('inprog'):''}</span></div>
      <div class="tag ${a.tag}">${tagTxt}</div>
      ${done?'<div class="tick">✓</div>':''}
    </button>`;
  }).join('');
  app.innerHTML=`
    ${heroBar([chipHome(),SEP,chipSubject(s),SEP,chipHere(t('Lesson')+' '+idx)].join(''))}
    <div class="card">
      <span class="pill">${l.emoji} ${t('Lesson')} ${idx}</span>
      <h2 class="title" style="margin-top:10px">${esc(l.title)}</h2>

}
