/* ---------- PASSAGE ---------- */
function renderPassage(){
  const a=CTX.a, s=CTX.s, l=CTX.l;
  const idx=s.lessons.indexOf(l)+1;
  const paras=a.body?a.body.split(/\n\n+/):[];
  const pTxt=r=>paras.slice(r[0],r[1]+1).map(esc).join('</p><p>');
  /* a passage either carries hand-authored `steps`, or labels ranges of its
     own body paragraphs with `sections` — no content is duplicated */
  let steps=(Array.isArray(a.steps)&&a.steps.length&&typeof a.steps[0]==='object')?a.steps:null;
  let intro=a.intro||null, closing=a.closing||null, tags=a.tags||null;
  if(!steps && Array.isArray(a.sections) && paras.length){
    steps=a.sections.map(sec=>({ic:sec.ic,title:sec.title,body:pTxt(sec.p)}));
    if(a.introP) intro=pTxt(a.introP);
    if(a.closingP) closing={ic:a.closingIc||'🌟', html:pTxt(a.closingP)};
  }
  if(steps&&!tags) tags=[
    {t:tf('sectionsTag',{n:steps.length}), bg:'#f1ecff', c:'#6d28d9'},
    {t:t('checkOffTag'), bg:'#e8f7ee', c:'#15803d'}
  ];
  const dkey=a.id;
  const d=getDraft(dkey);
  let read = (d&&Array.isArray(d.read)&&steps&&d.read.length===steps.length) ? d.read.slice()
           : (steps?steps.map(()=>false):[]);

  function saveD(){ if(steps) setDraft(dkey,{read:read.slice()}); }
  window._rdStep=function(i){ read[i]=!read[i]; saveD(); draw(); };

  function bodyCards(){
    if(steps) return '';
    if(a.recipe){
      return `<div class="rd-card">
        <b style="font-size:17px">Mga Sangkap:</b>
        <ul class="ingredients">${a.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
        <b style="font-size:17px">Paraan ng Pagluluto:</b>
        <ol style="line-height:1.8;margin-top:8px">${(a.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      </div>`;
    }
    return `<div class="rd-card"><div class="passage ${a.poem?'poem':''}"><div class="ptext">${esc(a.body)}</div></div></div>`;
  }

  function stepCards(){
    return steps.map((st,i)=>`
      <div class="rd-card rd-step">
        <div class="rd-stephead">
          <div class="rd-num">${i+1}</div>
          <div>
            <div class="rd-steplbl">${tf('stepLabel',{n:i+1})} · ${st.ic||''}</div>
            <h2>${esc(st.title)}</h2>
          </div>
        </div>
        <p>${st.body}</p>
        ${st.quote?`<div class="rd-quote">${esc(st.quote)}</div>`:''}
        ${st.bullets?`<div class="rd-bullets">${st.bullets.map(b=>`
          <div class="rd-bullet" style="background:${b.bg}"><div class="dot" style="background:${b.dot}"></div><p>${b.text}</p></div>`).join('')}</div>`:''}
        <button class="rd-mark ${read[i]?'done':''}" onclick="window._rdStep(${i})">${read[i]?t('markDone'):t('markRead')}</button>
      </div>`).join('');
  }

  function draw(){
    const count=read.filter(Boolean).length;
    const total=steps?steps.length:0;
    const pct=total?Math.round(count/total*100):0;
    const allRead=!steps||count===total;

    app.innerHTML=`
      <div class="rd-hero">
        <div class="rd-hero-in">
          <button class="rd-brand" onclick="home()">
            <div class="mark">📚</div>
            <div>
              <div class="name">Interaktibong Reviewer</div>
              <div class="sub">Piliin ang asignatura at magsimulang mag-aral!</div>
            </div>
          </button>
          <div class="rd-crumbs">
            <button class="rd-chip" onclick="home()">🏠 Home</button>
            <span class="sep">›</span>
            <button class="rd-chip" onclick="subject('${s.id}')">${esc(s.short||s.name)}</button>
            <span class="sep">›</span>
            <button class="rd-chip" onclick="lesson('${l.id}')">${t('Lesson')} ${idx}</button>
            <span class="sep">›</span>
            <span class="rd-chip here">${a.icon||'📖'} ${t('tagRead')}</span>
          </div>
        </div>
      </div>

      ${steps?`<div class="rd-prog">
        <div class="rd-prog-in">
          <div class="lbl">${tf('progRead',{c:count,n:total})}</div>
          <div class="track"><i style="width:${pct}%"></i></div>
          <div class="pc">${pct}%</div>
        </div>
      </div>`:''}

      <div class="rd-body">
        <div class="rd-card rd-title">
          <div class="rd-eyebrow">${esc(a.desc||'')}</div>
          <h1>${esc(a.heading)}</h1>
          ${a.by&&!tags?`<div class="by">${esc(a.by)}</div>`:''}
          ${tags?`<div class="rd-tags">${tags.map(x=>`<span style="background:${x.bg};color:${x.c}">${esc(x.t)}</span>`).join('')}</div>`:''}
        </div>

        ${intro?`<div class="rd-card">
          <p>${intro}</p>
          ${a.callout?`<div class="rd-callout"><div class="ic">${a.callout.ic}</div><p>${esc(a.callout.text)}</p></div>`:''}
        </div>`:''}

        ${steps?stepCards():bodyCards()}

        ${closing?`<div class="rd-closing"><div class="ic">${closing.ic}</div><p>${closing.html||esc(closing.text)}</p></div>`:''}

        ${(steps&&allRead)?`<div class="rd-celebrate">
          <div class="big">🎉</div>
          <div class="h">${t('doneTitle')}</div>
          <div class="s">${tf('doneSub',{b:t('doneReading')})}</div>
        </div>`:''}

        <div class="rd-foot">
          <button class="rd-btn back" onclick="lesson('${l.id}')">${t('backLesson')}</button>
          ${allRead
            ?`<button class="rd-btn finish" onclick="finishRead()">${t('doneReading')}</button>`
            :`<button class="rd-btn locked" disabled>${tf('lockedMsg',{n:total,r:total-count})}</button>`}
          ${a.orig?`<a class="rd-orig" href="${a.orig}" target="_blank">${t('viewOrig')}</a>`:''}
        </div>
      </div>`;
  }
  draw();
}
function finishRead(){ clearDraft(CTX.a.id); markDone(CTX.a); lesson(CTX.l.id); }

/* ---------- MCQ ---------- */
function renderMCQ(){
  const items=CTX.a.items; const dkey=CTX.a.id; const useDraft=!CTX.review;
  let i=0, score=0, answered=false; let wrong=[]; const answers=[]; let curPick=null;
  function saveD(){ if(useDraft) setDraft(dkey,{answers:answers.slice(), curPick}); }
  function draw(){
    answered=false; curPick=null;
    const it=items[i];
    app.innerHTML=`${crumbs()}
      <div class="card">
        <div class="qhead"><span class="qcount">${t('question')} ${i+1} / ${items.length}</span><span class="qcount">${t('points')}: ${score}</span></div>
        <div class="qbar"><i style="width:${(i)/items.length*100}%"></i></div>
        <div class="qtext"><span class="idx">${i+1}.</span> ${esc(it.q)}</div>
        <div id="opts">${it.o.map((o,k)=>`<button class="opt" onclick="window._pick(${k})"><span class="lead">${'ABCDEF'[k]}.</span>${esc(o)}</button>`).join('')}</div>
        <div id="fb"></div>
        <div class="navq"><span></span><button class="btn" id="nx" disabled onclick="window._next()">${i+1<items.length?t('next'):t('finish')}</button></div>
      </div>`;
  }
  function reveal(k){
    const it=items[i]; const opts=document.querySelectorAll('#opts .opt');
    opts.forEach((el,idx)=>{el.style.pointerEvents='none';
      if(idx===it.a)el.classList.add('correct');
      if(idx===k&&k!==it.a)el.classList.add('wrong');});
    const ok=k===it.a;
    document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?t('right'):t('wrong')} ${it.e?esc(it.e):''}${it.flag?' <em>'+t('teacherNote')+'</em>':''}</div>`;
    document.getElementById('nx').disabled=false;
    return ok;
  }
  window._pick=function(k){
    if(answered)return; answered=true; curPick=k;
    const ok=reveal(k); if(ok)score++; else wrong.push(items[i]);
    saveD();
  };
  window._next=function(){
    answers.push(curPick);
    if(i+1<items.length){ i++; draw(); saveD(); }
    else { if(useDraft) clearDraft(dkey); LASTWRONG=wrong.length?{type:'mcq',items:wrong}:null; finishQuiz(score,items.length); }
  };
  // restore any in-progress answers
  const d=useDraft?getDraft(dkey):null;
  if(d && d.answers){
    d.answers.forEach(k=>{ const it=items[i]; if(k===it.a)score++; else wrong.push(it); answers.push(k); i++; });
    draw();
    if(d.curPick!=null){ answered=true; curPick=d.curPick; const ok=reveal(d.curPick); if(ok)score++; else wrong.push(items[i]); }
  } else { draw(); }
}

/* ---------- MATCHING ---------- */
function renderMatching(){
  const a=CTX.a; const left=a.left; const dkey=CTX.a.id; const useDraft=!CTX.review;
  const order = shuffle(a.right.map((r,i)=>i)); // display order of the right column (deterministic)
  const LETTERS='ABCDEFGHIJ';
  const d=useDraft?getDraft(dkey):null;
  let selLeft=null; const pairs=(d&&d.pairs)?Object.assign({},d.pairs):{}; // leftIdx -> rightIdx
  let checked=false, recorded=false;
  function saveD(){ if(useDraft) setDraft(dkey,{pairs}); }
  const isRight=i=>pairs[i]===a.answer[i];

  window._L=function(i){
    if(checked&&isRight(i))return;                 // a correct pair is locked
    if(pairs[i]!=null){ delete pairs[i]; selLeft=null; saveD(); draw(); return; }
    selLeft = selLeft===i?null:i; draw();
  };
  window._R=function(pos){
    if(selLeft==null)return;
    const ri=order[pos];
    Object.keys(pairs).forEach(k=>{ if(pairs[k]===ri) delete pairs[k]; });   // a card can only be used once
    pairs[selLeft]=ri; selLeft=null; saveD(); draw();
  };
  window._mtCheck=function(){ if(useDraft) clearDraft(dkey); checked=true; selLeft=null; draw(); };
  window._mtFix=function(){
    checked=false; recorded=false; selLeft=null;
    left.forEach((_,i)=>{ if(pairs[i]!=null && !isRight(i)) delete pairs[i]; });
    saveD(); draw();
  };

  function draw(){
    const matched=left.filter((_,i)=>pairs[i]!=null).length;
    const total=left.length;
    const rightCount=left.filter((_,i)=>isRight(i)).length;
    const allMatched=matched===total;
    const pct=total?Math.round(matched/total*100):0;
    const hint = selLeft!=null ? t('mtHintB') : (allMatched&&!checked ? t('mtHintCheck') : '');

    const colA=left.map((txt,i)=>{
      const has=pairs[i]!=null;
      const ok=checked&&has&&isRight(i), no=checked&&has&&!isRight(i);
      const cls='mtq-card'+(selLeft===i?' sel':'')+(ok?' ok':'')+(no?' no':'');
      const badge=has?`<span class="mtq-badge${ok?' ok':''}${no?' no':''}">${ok?'✓ ':''}${no?'✗ ':''}${LETTERS[order.indexOf(pairs[i])]}</span>`:'';
      return `<button class="${cls}" onclick="window._L(${i})"><p>${esc(txt)}</p>${badge}</button>`;
    }).join('');

    const colB=order.map((ri,pos)=>{
      const usedBy=left.findIndex((_,i)=>pairs[i]===ri);
      let cls='mtq-card mtq-b', lcls='mtq-letter';
      if(usedBy!==-1){
        const ok=checked&&a.answer[usedBy]===ri, no=checked&&!ok;
        cls+= ok?' ok':(no?' no':' used');
        if(ok)lcls+=' ok'; if(no)lcls+=' no';
      } else if(selLeft!=null){ cls+=' target'; }
      return `<button class="${cls}" onclick="window._R(${pos})">
        <span class="${lcls}">${LETTERS[pos]}</span><p>${esc(a.right[ri])}</p></button>`;
    }).join('');

    app.innerHTML=`${crumbs()}
      <div class="rd-prog">
        <div class="rd-prog-in">
          <div class="lbl">${tf('mtMatched',{c:matched,n:total})}</div>
          <div class="track"><i style="width:${pct}%"></i></div>
          <div class="pc">${esc(hint)}</div>
        </div>
      </div>
      <div class="card">
        <div class="rd-eyebrow">${esc(CTX.s.short||CTX.s.name)} · ${t('Lesson')} ${CTX.s.lessons.indexOf(CTX.l)+1}</div>
        <h2 class="title" style="margin-top:8px">${esc(a.name)}</h2>
        <p class="sub" style="margin:0">👆 ${t('matchHint')}</p>
      </div>
      <div class="mtq-grid">
        <div class="mtq-col"><div class="mtq-lbl">${t('colA')}</div>${colA}</div>
        <div class="mtq-col"><div class="mtq-lbl">${t('colB')}</div>${colB}</div>
      </div>
      ${(checked&&rightCount===total)?`<div class="mtq-perfect">
        <div class="em">🏆</div>
        <div class="h">${t('mtPerfect')}</div>
        <div class="s">${t('mtPerfectSub')}</div>
      </div>`:''}
      ${(checked&&rightCount<total)?`<div class="mtq-partial">
        <div class="em">💪</div>
        <div class="txt">
          <div class="h">${tf('mtScore',{r:rightCount,n:total})}</div>
          <div class="s">${t('mtWrongSub')}</div>
        </div>
        <button class="mtq-fix" onclick="window._mtFix()">${t('mtFix')}</button>
      </div>`:''}
      <div class="navq mt">
        ${backBtn()}
        ${checked?'':`<button class="btn" ${allMatched?'':'disabled'} onclick="window._mtCheck()">${t('check')} ✓</button>`}
      </div>`;

    if(checked&&!recorded){
      recorded=true;
      const wL=[],wA=[];
      left.forEach((txt,i)=>{ if(!isRight(i)){ wL.push(txt); wA.push(a.answer[i]); } });
      LASTWRONG = wL.length?{type:'matching', left:wL, answer:wA}:null;
      if(!CTX.review){ setBest(CTX.a,Math.round(rightCount/total*100)); markDone(CTX.a); }
    }
  }
  draw();
}

/* ---------- SEQUENCING ---------- */
function renderSeq(){
  const a=CTX.a; const correct=a.items.slice(); const dkey=CTX.a.id; const useDraft=!CTX.review;
  const d=useDraft?getDraft(dkey):null;
  let order;
  if(d && Array.isArray(d.order) && d.order.length===correct.length){ order=d.order.slice(); }
  else { order=shuffle(correct.map((_,i)=>i)); if(order.every((v,i)=>v===i)) order.reverse(); }
  let checked=false;
  function saveD(){ if(useDraft) setDraft(dkey,{order:order.slice()}); }

  function draw(){
    const rows=order.map((ci,pos)=>{
      let cls='seq-item';
      if(checked)cls+= (ci===pos?' ok':' bad');
      return `<div class="${cls}" data-ci="${ci}"${checked?'':' draggable="true"'}>
        <span class="pos">${checked?(ci===pos?'✓':'✗'):pos+1}</span>
        <div class="body">${esc(correct[ci])}</div>
        ${checked?'':`<div class="arrows">
          <button type="button" aria-label="${t('moveUp')}" onclick="window._mv(${pos},-1)">▲</button>
          <button type="button" aria-label="${t('moveDown')}" onclick="window._mv(${pos},1)">▼</button>
        </div><span class="grip" aria-hidden="true" title="${t('dragHint')}">⠿</span>`}
      </div>`;
    }).join('');
    app.innerHTML=`${crumbs()}
      <div class="card">
        <div class="qtext" style="font-size:16px">${t('seqHint')}</div>
        <div id="seqlist" class="seq-list">${rows}</div>
        ${a.flag&&checked?'<div class="note">'+t('seqNote')+'</div>':''}
        <div class="navq mt">${backBtn()}
        ${checked?`<button class="btn" onclick="finishQuiz(${order.filter((ci,pos)=>ci===pos).length},${order.length})">${t('showScore')}</button>`
                 :`<button class="btn" onclick="window._chk()">${t('check')}</button>`}</div>
      </div>`;
    if(!checked) wireDrag();
  }

  window._mv=function(pos,dir){
    const np=pos+dir; if(np<0||np>=order.length)return;
    [order[pos],order[np]]=[order[np],order[pos]]; saveD(); draw();
  };
  window._chk=function(){ if(useDraft) clearDraft(dkey); checked=true; draw(); };

  /* drag to reorder — native DnD for mouse, pointer events (via the grip) for touch */
  function wireDrag(){
    const list=document.getElementById('seqlist');
    if(!list) return;
    let dragEl=null;
    const rowsArr=()=>Array.prototype.slice.call(list.querySelectorAll('.seq-item'));
    function renumber(){ rowsArr().forEach((el,i)=>{ const p=el.querySelector('.pos'); if(p)p.textContent=i+1; }); }
    function commit(){ order=rowsArr().map(el=>+el.dataset.ci); saveD(); renumber(); }
    function placeAt(y){
      let after=null, best=Number.NEGATIVE_INFINITY;
      rowsArr().forEach(el=>{
        if(el===dragEl)return;
        const box=el.getBoundingClientRect();
        const off=y-box.top-box.height/2;
        if(off<0 && off>best){ best=off; after=el; }
      });
      if(after==null) list.appendChild(dragEl); else list.insertBefore(dragEl,after);
      renumber();
    }
    function start(el){ dragEl=el; el.classList.add('dragging'); list.classList.add('dragging-any'); }
    function end(){
      if(!dragEl)return;
      dragEl.classList.remove('dragging'); list.classList.remove('dragging-any');
      dragEl=null; commit();
    }

    list.addEventListener('dragstart',e=>{
      const el=e.target.closest('.seq-item'); if(!el)return;
      start(el);
      try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',''); }catch(_){}
    });
    list.addEventListener('dragover',e=>{ if(!dragEl)return; e.preventDefault(); placeAt(e.clientY); });
    list.addEventListener('drop',e=>{ if(!dragEl)return; e.preventDefault(); });
    list.addEventListener('dragend',end);

    let pid=null,startY=0,moved=false;
    list.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse')return;                 // mouse uses native drag and drop
      if(!e.target.classList.contains('grip'))return;    // touch drags only from the handle
      const el=e.target.closest('.seq-item'); if(!el)return;
      pid=e.pointerId; startY=e.clientY; moved=false; start(el);
      try{ e.target.setPointerCapture(pid); }catch(_){}
    });
    list.addEventListener('pointermove',e=>{
      if(!dragEl||e.pointerId!==pid)return;
      if(!moved && Math.abs(e.clientY-startY)<6)return;
      moved=true; e.preventDefault(); placeAt(e.clientY);
    });
    function ptrEnd(e){ if(!dragEl||e.pointerId!==pid)return; pid=null; end(); }
    list.addEventListener('pointerup',ptrEnd);
    list.addEventListener('pointercancel',ptrEnd);
  }

  draw();
}

/* ---------- FILL IN THE BLANK ---------- */
function renderFill(){
  const a=CTX.a; const opts=a.wordbox; const dkey=CTX.a.id; const useDraft=!CTX.review;
  window._fv=function(){ if(useDraft) setDraft(dkey,{values:a.items.map((_,i)=>{const el=document.getElementById('s'+i);return el?el.value:'';})}); };
  function draw(){
    const box=`<div class="wordbox">${opts.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
    const rows=a.items.map((it,i)=>{
      return `<div class="fbq">${i+1}. ${esc(it.before)}
        <select id="s${i}" onchange="window._fv()">
          <option value="">${t('choose')}</option>
          ${opts.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('')}
        </select>${esc(it.after)}</div>`;
    }).join('');
    app.innerHTML=`${crumbs()}
      <div class="card">
        <div class="qtext" style="font-size:16px">${t('fillHint')}</div>
        ${box}${rows}
        <div class="navq mt">${backBtn()}<button class="btn" onclick="window._chk()">${t('check')}</button></div>
      </div>`;
    const d=useDraft?getDraft(dkey):null;
    if(d&&d.values){ a.items.forEach((_,i)=>{ const el=document.getElementById('s'+i); if(el&&d.values[i]) el.value=d.values[i]; }); }
  }
  window._chk=function(){
    if(useDraft) clearDraft(dkey);
    let score=0; const w=[];
    a.items.forEach((it,i)=>{
      const sel=document.getElementById('s'+i); const val=sel.value;
      const ok = Array.isArray(it.a) ? it.a.includes(val) : val===it.a;
      if(ok){score++;sel.className='ok';}else{sel.className='no';w.push(it);}
      sel.disabled=true;
      // append correct answer note
      const note=document.createElement('small');
      note.style.color='var(--muted)'; note.style.marginLeft='6px';
      note.innerHTML= ok?' ✓':` ✗ (${esc(Array.isArray(it.a)?it.a.join(' / '):it.a)})`;
      sel.parentNode.appendChild(note);
    });
    LASTWRONG = w.length?{type:'fillblank', items:w}:null;
    const bar=document.querySelector('.navq');
    bar.innerHTML=`${backBtn()}<button class="btn" onclick="finishQuiz(${score},${a.items.length})">${t('showScore')}</button>`;
  };
  draw();
}

/* ---------- IDENTIFICATION (type the answer) ---------- */
/* accepts the answer in any case/spacing, ignores accents and trailing punctuation,
   and any string in an item's `alt` array counts as correct too */
/* On a phone the software keyboard covers the lower third of the screen, which
   can hide the answer box entirely. Keep the focused field in the part of the
   viewport that is actually visible (visualViewport excludes the keyboard). */
function idKeepVisible(){
  const el=document.getElementById('idIn');
  if(!el||document.activeElement!==el) return;
  const vv=window.visualViewport;
  const vh=vv?vv.height:window.innerHeight;
  const headTop=(document.querySelector('.rd-prog')||{}).offsetHeight||56;
  const r=el.getBoundingClientRect();
  const top=headTop+12, bottom=vh-16;
  if(r.bottom>bottom || r.top<top) window.scrollBy(0, r.top-top);
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', idKeepVisible);
  window.visualViewport.addEventListener('scroll', idKeepVisible);
}

function normAns(s){
  return String(s==null?'':s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // strip accents
    .toLowerCase()
    .replace(/[.,;:!?"'\u2018\u2019\u201c\u201d]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function identOK(it,val){
  const v=normAns(val); if(!v) return false;
  const accepted=[it.a].concat(Array.isArray(it.alt)?it.alt:[]);
  return accepted.some(x=>normAns(x)===v);
}

function renderIdent(){
  const a=CTX.a; const dkey=CTX.a.id; const useDraft=!CTX.review;
  const total=a.items.length;
  const d=useDraft?getDraft(dkey):null;
  let vals=(d&&Array.isArray(d.vals)&&d.vals.length===total)?d.vals.slice():a.items.map(()=>'');
  let idx=0, checked=false, recorded=false;

  function stash(){
    const el=document.getElementById('idIn');
    if(el){ vals[idx]=el.value; if(useDraft) setDraft(dkey,{vals:vals.slice()}); }
  }
  window._idIn=function(){
    const el=document.getElementById('idIn'); if(!el)return;
    vals[idx]=el.value; if(useDraft) setDraft(dkey,{vals:vals.slice()});
    const c=vals.filter(v=>v&&v.trim()).length;
    const n=document.getElementById('idAns'); if(n) n.textContent=tf('idAnsShort',{c});
    const dot=document.querySelector('.id-dot.at');
    if(dot) dot.classList.toggle('filled', !!(el.value&&el.value.trim()));
  };
  window._idGo=function(n){ stash(); idx=Math.max(0,Math.min(total-1,n)); draw(); };
  window._idNext=function(){ if(idx<total-1) window._idGo(idx+1); else window._idFinish(); };
  window._idFinish=function(){ stash(); if(useDraft) clearDraft(dkey); checked=true; draw(); };
  window._idAgain=function(){ openAct(CTX.l.id,CTX.a.id); };
  window._idKey=function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); window._idNext(); } };

  function head(posLabel, rightLabel, pct){
    return `<div class="rd-prog">
      <div class="rd-prog-in">
        <div class="lbl">${posLabel}</div>
        <div class="track"><i style="width:${pct}%"></i></div>
        <div class="${checked?'sc':'save'}" id="idAns">${rightLabel}</div>
      </div>
    </div>`;
  }
  function titleCard(){
    return `<div class="card">
      <div class="rd-eyebrow">${esc(CTX.s.short||CTX.s.name)} · ${t('Lesson')} ${CTX.s.lessons.indexOf(CTX.l)+1}</div>
      <h2 class="title" style="margin-top:8px">${esc(a.name)}</h2>
      <p class="sub" style="margin:0">${a.prompt||t('idHint')}</p>
    </div>`;
  }
  function feedback(it,i){
    const ok=identOK(it,vals[i]);
    const blank=!vals[i]||!vals[i].trim();
    return ok
      ? `<div class="id-fb ok">${t('idCorrect')}${it.e?' '+esc(it.e):''}</div>`
      : `<div class="id-fb no">${tf(blank?'idBlank':'idIncorrect',{a:esc(it.a)})}${it.e?' '+esc(it.e):''}</div>`;
  }

  function draw(){
    const answered=vals.filter(v=>v&&v.trim()).length;

    /* ---------- answering: one question per card ---------- */
    if(!checked){
      document.body.classList.add('idpage');
      const it=a.items[idx];
      const dots=a.items.map((_,i)=>{
        const filled=vals[i]&&vals[i].trim()?' filled':'';
        return `<button class="id-dot${filled}${i===idx?' at':''}" title="${i+1}" onclick="window._idGo(${i})"></button>`;
      }).join('');
      app.innerHTML=`${crumbs()}
        ${head(tf('idPos',{c:idx+1,n:total}), tf('idAnsShort',{c:answered}), Math.round((idx+1)/total*100))}
        ${titleCard()}
        <div class="idq one">
          <div class="idq-head">
            <div class="idq-num">${idx+1}</div>
            <p>${esc(it.q)}</p>
          </div>
          <input id="idIn" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" inputmode="text" enterkeyhint="${idx<total-1?'next':'done'}"
            placeholder="${t('idPlaceholder')}" oninput="window._idIn()" onkeydown="window._idKey(event)"
            onfocus="setTimeout(idKeepVisible,50)">
        </div>
        <div class="id-dots">${dots}</div>
        <div class="id-nav">
          ${backBtn()}
          <span class="right">
            <button class="btn secondary" ${idx===0?'disabled':''} onclick="window._idGo(${idx-1})">${t('idPrev')}</button>
            <button class="btn" onclick="window._idNext()">${idx<total-1?t('next'):t('finish')}</button>
          </span>
        </div>`;
      const el=document.getElementById('idIn');
      if(el){
        el.value=vals[idx]||'';
        try{ el.focus({preventScroll:true}); }catch(_){ el.focus(); }
        try{ el.setSelectionRange(el.value.length,el.value.length); }catch(_){}
        idKeepVisible();
        setTimeout(idKeepVisible,120);   // again once the keyboard has animated in
      }
      return;
    }

    document.body.classList.remove('idpage');
    /* ---------- checked: every answer with the correct one ---------- */
    let score=0; a.items.forEach((it,i)=>{ if(identOK(it,vals[i])) score++; });
    const cards=a.items.map((it,i)=>{
      const ok=identOK(it,vals[i]);
      return `<div class="idq">
        <div class="idq-head">
          <div class="idq-num">${i+1}</div>
          <p>${esc(it.q)}</p>
        </div>
        <input type="text" disabled class="${ok?'ok':'no'}" value="${esc(vals[i]||'')}"
          placeholder="${t('idPlaceholder')}">
        ${feedback(it,i)}
      </div>`;
    }).join('');
    const emoji = score===total?'🏆':(score/total>=.8?'🎉':(score/total>=.5?'💪':'📖'));
    const msg = score===total?t('tfMsgTop'):(score/total>=.5?t('tfMsgMid'):t('tfMsgLow'));
    const wrongItems=a.items.filter((it,i)=>!identOK(it,vals[i]));

    app.innerHTML=`${crumbs()}
      ${head(tf('idAnswered',{c:answered,n:total}), tf('tfScore',{s:score}), 100)}
      ${titleCard()}
      <div class="tf-done">
        <div class="em">${emoji}</div>
        <div class="h">${tf('tfScored',{s:score,n:total})}</div>
        <div class="s">${msg}</div>
        <div class="acts">
          ${wrongItems.length?`<button class="btn retry" onclick="reviewWrong()">${t('retryWrong')} (${wrongItems.length})</button>`:''}
          <button class="tf-again" onclick="window._idAgain()">${t('tfAgain')}</button>
          <button class="btn secondary" onclick="lesson('${CTX.l.id}')">${t('backLesson')}</button>
        </div>
      </div>
      <div class="id-review-h">${t('idReview')}</div>
      ${cards}
      <div class="navq mt">${backBtn()}<span></span></div>`;

    if(!recorded){
      recorded=true;
      LASTWRONG = wrongItems.length?{type:'identification', items:wrongItems}:null;
      if(!CTX.review){ setBest(CTX.a,Math.round(score/total*100)); markDone(CTX.a); }
    }
    window.scrollTo(0,0);
  }
  draw();
}

/* ---------- TRUE / FALSE (B / HB) ---------- */
function renderTF(){
  const a=CTX.a; const dkey=CTX.a.id; const useDraft=!CTX.review;
  const d=useDraft?getDraft(dkey):null;
  const picks=(d&&d.picks)?Object.assign({},d.picks):{};
  const tLabel=a.tLabel||'B — Binanggit', fLabel=a.fLabel||'HB — Hindi';
  const prompt=a.prompt||'Piliin ang <b>B</b> kung binanggit sa reseta, <b>HB</b> kung hindi.';
  const total=a.items.length;
  let recorded=false;
  function saveD(){ if(useDraft) setDraft(dkey,{picks}); }

  window._p=function(i,v){
    if(picks[i]!=null)return;      // each item is answered once, then locked
    picks[i]=v; saveD(); draw();
  };
  window._tfAgain=function(){ openAct(CTX.l.id,CTX.a.id); };

  function draw(){
    const keepY=window.scrollY;   // answering re-renders the list — do not jump to the top
    const answered=a.items.filter((_,i)=>picks[i]!=null).length;
    let score=0; a.items.forEach((it,i)=>{ if(picks[i]===it.a) score++; });
    const allDone=answered===total;
    const pct=total?Math.round(answered/total*100):0;

    const cards=a.items.map((it,i)=>{
      const picked=picks[i], done=picked!=null, right=done&&picked===it.a;
      const kind=v=>{
        if(!done)return '';
        if(picked===v)return right?'right':'wrong';
        return it.a===v?'reveal':'dim';
      };
      const tick=v=>(done&&it.a===v)?' ✓':'';
      const fb = !done ? '' : (right
        ? `<div class="tf-fb ok">${t('tfCorrect')}${it.e?' '+esc(it.e):''}</div>`
        : `<div class="tf-fb no">${tf('tfIncorrect',{a:esc(it.a?(a.tWord||tLabel):(a.fWord||fLabel))})}${it.e?' '+esc(it.e):''}</div>`);
      return `<div class="tfq" id="tf${i}">
        <div class="tfq-head">
          <div class="tfq-num">${i+1}</div>
          <p>${esc(it.st)}</p>
        </div>
        <div class="tfq-opts">
          <button class="tfb ${kind(true)}" ${done?'disabled':''} onclick="window._p(${i},true)">${esc(tLabel)}${tick(true)}</button>
          <button class="tfb ${kind(false)}" ${done?'disabled':''} onclick="window._p(${i},false)">${esc(fLabel)}${tick(false)}</button>
        </div>
        ${fb}
      </div>`;
    }).join('');

    const emoji = score===total?'🏆':(score/total>=.8?'🎉':(score/total>=.5?'💪':'📖'));
    const msg = score===total?t('tfMsgTop'):(score/total>=.5?t('tfMsgMid'):t('tfMsgLow'));
    const wrongItems=a.items.filter((it,i)=>picks[i]!=null&&picks[i]!==it.a);

    app.innerHTML=`${crumbs()}
      <div class="rd-prog">
        <div class="rd-prog-in">
          <div class="lbl">${tf('tfAnswered',{c:answered,n:total})}</div>
          <div class="track"><i style="width:${pct}%"></i></div>
          <div class="sc">${tf('tfScore',{s:score})}</div>
        </div>
      </div>
      <div class="card">
        <div class="rd-eyebrow">${esc(CTX.s.short||CTX.s.name)} · ${t('Lesson')} ${CTX.s.lessons.indexOf(CTX.l)+1}</div>
        <h2 class="title" style="margin-top:8px">${esc(a.name)}</h2>
        <p class="sub" style="margin:0">${prompt}</p>
      </div>
      ${cards}
      ${allDone?`<div class="tf-done">
        <div class="em">${emoji}</div>
        <div class="h">${tf('tfScored',{s:score,n:total})}</div>
        <div class="s">${msg}</div>
        <div class="acts">
          ${wrongItems.length?`<button class="btn retry" onclick="reviewWrong()">${t('retryWrong')} (${wrongItems.length})</button>`:''}
          <button class="tf-again" onclick="window._tfAgain()">${t('tfAgain')}</button>
          <button class="btn secondary" onclick="lesson('${CTX.l.id}')">${t('backLesson')}</button>
        </div>
      </div>`:`<div class="navq">${backBtn()}<span></span></div>`}`;

    if(allDone&&!recorded){
      recorded=true;
      LASTWRONG = wrongItems.length?{type:'truefalse', items:wrongItems}:null;
      if(!CTX.review){ setBest(CTX.a,Math.round(score/total*100)); markDone(CTX.a); clearDraft(dkey); }
    }
    window.scrollTo(0,keepY);
  }
  draw();
}

/* ---------- SHORTCHECK (self-check) ---------- */
function renderShort(){
  const a=CTX.a; const dkey=CTX.a.id; const total=a.items.length;
  const d=getDraft(dkey)||{};
  let texts=Array.isArray(d.texts)&&d.texts.length===total?d.texts.slice():a.items.map(()=>'');
  let shown=Array.isArray(d.shown)&&d.shown.length===total?d.shown.slice():a.items.map(()=>false);
  let rating=Array.isArray(d.rating)&&d.rating.length===total?d.rating.slice():a.items.map(()=>null);
  function saveD(){ setDraft(dkey,{texts:texts.slice(),shown:shown.slice(),rating:rating.slice()}); }

  /* typing must not re-render (it would steal the caret) — save and nudge the button instead */
  window._sc=function(i){
    const el=document.getElementById('ta'+i); if(!el)return;
    texts[i]=el.value; saveD();
    const btn=document.getElementById('sh'+i);
    const nudge=document.getElementById('nd'+i);
    const has=el.value.trim().length>0;
    if(btn) btn.disabled=!has;
    if(nudge) nudge.style.display=has?'none':'';
  };
  window._scShow=function(i){ if(!texts[i]||!texts[i].trim())return; shown[i]=true; saveD(); draw(); };
  window._scRate=function(i,v){ rating[i]=v; saveD(); draw(); };

  function draw(){
    const rated=rating.filter(r=>r!=null).length;
    const pct=total?Math.round(rated/total*100):0;
    const allRated=rated===total;

    const cards=a.items.map((it,i)=>{
      const has=(texts[i]||'').trim().length>0;
      const body = shown[i] ? `
        <div class="sc-model">
          <div class="lbl">${t('scModelLbl')}</div>
          <p>${esc(it.m)}</p>
        </div>
        ${rating[i]==null?`<div class="scq-row">
          <span class="sc-ask">${t('scCompare')}</span>
          <button class="sc-rate good" onclick="window._scRate(${i},'good')">${t('scGood')}</button>
          <button class="sc-rate retry" onclick="window._scRate(${i},'retry')">${t('scRetry')}</button>
        </div>`:`<span class="sc-chip ${rating[i]}">${rating[i]==='good'?t('scGoodChip'):t('scRetryChip')}</span>`}`
        : `<div class="scq-row">
          <button class="sc-show" id="sh${i}" ${has?'':'disabled'} onclick="window._scShow(${i})">${t('scShowBtn')}</button>
          <span class="sc-nudge" id="nd${i}" ${has?'style="display:none"':''}>${t('scNeedAnswer')}</span>
        </div>`;
      return `<div class="scq">
        <div class="scq-head">
          <div class="scq-num">${i+1}</div>
          <h2>${esc(it.q)}</h2>
        </div>
        <textarea id="ta${i}" rows="4" oninput="window._sc(${i})" placeholder="${t('scPlaceholder')}"></textarea>
        ${body}
      </div>`;
    }).join('');

    app.innerHTML=`${crumbs()}
      <div class="rd-prog">
        <div class="rd-prog-in">
          <div class="lbl">${tf('scChecked',{c:rated,n:total})}</div>
          <div class="track"><i style="width:${pct}%"></i></div>
          <div class="save">${t('scSaved')}</div>
        </div>
      </div>
      <div class="card">
        <div class="rd-eyebrow">${esc(CTX.s.short||CTX.s.name)} · ${t('Lesson')} ${CTX.s.lessons.indexOf(CTX.l)+1}</div>
        <h2 class="title" style="margin-top:8px">${esc(a.name)}</h2>
        <p class="sub" style="margin:0">${t('scHint')}</p>
      </div>
      ${cards}
      ${allRated?`<div class="sc-finished">
        <div class="em">🎉</div>
        <div class="h">${t('scFinished')}</div>
        <div class="s">${t('scFinishedSub')}</div>
      </div>`:''}
      <div class="navq mt">
        ${backBtn()}
        ${allRated?`<button class="btn" onclick="finishRead()">${t('scDone')}</button>`
                  :`<button class="btn" disabled>${tf('scLocked',{n:total})}</button>`}
      </div>`;

    a.items.forEach((_,i)=>{ const el=document.getElementById('ta'+i); if(el) el.value=texts[i]||''; });
  }
  draw();
}

/* ---------- RESULTS ---------- */
function finishQuiz(score,total){
  document.body.classList.remove('read-theme');
  const pct=Math.round(score/total*100);
  if(!CTX.review){ setBest(CTX.a,pct); clearDraft(CTX.a.id); }
  const stars = pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'✨';
  const msg = pct>=90?t('msg90'):pct>=70?t('msg70'):pct>=50?t('msg50'):t('msg0');
  const emoji = pct>=90?'🏆':pct>=70?'🎉':pct>=50?'👍':'💪';
  const w=LASTWRONG; const wc = w?(w.items?w.items.length:(w.left?w.left.length:0)):0;
  const reviewBtn = wc>0 ? `<button class="btn retry" onclick="reviewWrong()">${t('retryWrong')} (${wc})</button>` : '';
  app.innerHTML=`${crumbs()}
    <div class="card result">
      ${CTX.review?'<span class="pill" style="margin-bottom:10px">'+t('reviewPill')+'</span>':''}
      <div class="big">${emoji}</div>
      <div class="stars">${stars}</div>
      <div class="score">${score}<small>/${total}</small></div>
      <div class="score" style="font-size:22px;color:var(--accent2);margin-top:-6px">${pct}%</div>
      <div class="msg">${msg}${(wc===0&&CTX.review)?t('allFixed'):''}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${reviewBtn}
        <button class="btn secondary" onclick="openAct('${CTX.l.id}','${CTX.a.id}')">${t('retryAll')}</button>
        <button class="btn" onclick="lesson('${CTX.l.id}')">${t('backLesson2')}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

/* review only the items answered wrong; keeps drilling until none left */
function reviewWrong(){
  const w=LASTWRONG; if(!w) return;
  const clone = w.type==='matching'
    ? Object.assign({},CTX.a,{left:w.left,answer:w.answer})
    : Object.assign({},CTX.a,{items:w.items});
  CTX.a=clone; CTX.review=true; LASTWRONG=null; _seed=7;
  ({mcq:renderMCQ,matching:renderMatching,fillblank:renderFill,truefalse:renderTF,identification:renderIdent})[w.type]();
  window.scrollTo(0,0);
}

home();
